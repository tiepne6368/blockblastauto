name: Build BlockBlastAuto Dylib

on:
  push:
    paths-ignore:
      - 'BlockBlastAuto.dylib'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid signer
        run: brew install ldid

      - name: Write and Compile Upgraded BlockBlastAuto.mm
        run: |
          cat << 'EOF' > BlockBlastAuto.mm
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #include <cstdint>
          #include <vector>
          #include <array>
          #include <string>
          #include <algorithm>
          #include <cmath>
          #include <atomic>

          namespace BBAuto {

          enum class PlayStrategy : int { AUTO_COMBO = 0, MAX_SURVIVAL = 1, AUTO_MODE = 2 };
          enum class EngineRunState : int { STOPPED = 0, AUTO_PLAYING = 1, GUIDE_PLAYING = 2 };

          struct PieceShape {
              int slotIndex = -1, rows = 0, cols = 0, cellCount = 0;
              uint32_t localMask = 0;
              bool valid = false;
              float centerNormX = 0.0f, centerNormY = 0.0f;
              float colorR = 220.0f, colorG = 220.0f, colorB = 220.0f;

              bool getCell(int r, int c) const {
                  if (r < 0 || r >= rows || c < 0 || c >= cols) return false;
                  return (localMask >> (r * 5 + c)) & 1U;
              }
              void setCell(int r, int c, bool val) {
                  if (r < 0 || r >= 5 || c < 0 || c >= 5) return;
                  if (val) localMask |= (1U << (r * 5 + c));
                  else localMask &= ~(1U << (r * 5 + c));
              }
          };

          struct PlacementMove {
              int slotIndex = -1;
              PieceShape piece;
              int targetRow = 0, targetCol = 0;
              uint64_t rawMaskOnBoard = 0ULL, expectedBoardAfter = 0ULL;
              int linesCleared = 0;
              bool valid = false;
          };

          struct TurnPlan {
              std::vector<PlacementMove> moves;
              double totalScore = -1e18;
              int totalLinesCleared = 0, validSequencesFound = 0, survivalTier = 0;
              PlayStrategy activeStrategy = PlayStrategy::AUTO_MODE;
              bool feasible = false;
          };

          struct CalibrationConfig {
              float boardX = 0.054f, boardY = 0.235f, boardW = 0.892f;
              float gridBorderRatio = 0.018f;
              float dockX = 0.035f, dockY = 0.686f, dockW = 0.930f, dockH = 0.160f;
              float dockCellScale = 0.45f;
              float dragLiftOffsetY = 112.0f;
              float dragSpeedMultiplier = 0.80f;
              float dragGainX = 1.65f, dragGainY = 1.65f;
              float learnedBiasRow = 0.0f, learnedBiasCol = 0.0f;
              bool showCalibrationOverlay = false;
          };

          struct RuntimeTelemetry {
              int turnsExecuted = 0, movesExecuted = 0, totalLinesCleared = 0;
              int currentCombo = 0, movesSinceLastClear = 0, lastValidSequences = 0;
              float lastBoardConfidence = 1.0f;
              uint64_t lastDetectedBoard = 0ULL;
              std::array<PieceShape, 3> lastDetectedDock;
              bool hasActiveGuideMove = false;
              PlacementMove currentGuideMove;
              int guideStepIndex = 0, guideTotalSteps = 0;
              bool isSteeringHold = false;
              int liveHeldRow = -1, liveHeldCol = -1;
              PlayStrategy requestedStrategy = PlayStrategy::AUTO_MODE;
              PlayStrategy effectiveStrategy = PlayStrategy::MAX_SURVIVAL;
              std::string statusMessage = "San sang";
          };

          inline int popcount64(uint64_t x) { return __builtin_popcountll(x); }

          // 1. BLOCK SOLVER: UU TIEN 1. SURVIVAL -> 2. FUTURE MOVES -> 3. COMBO -> 4. SCORE
          class BlockSolver {
          public:
              BlockSolver() { initMasks(); }

              static uint64_t computePlacementMask(const PieceShape& piece, int targetRow, int targetCol) {
                  uint64_t mask = 0ULL;
                  for (int r = 0; r < piece.rows; ++r)
                      for (int c = 0; c < piece.cols; ++c)
                          if (piece.getCell(r, c))
                              mask |= (1ULL << ((targetRow + r) * 8 + (targetCol + c)));
                  return mask;
              }

              static uint64_t simulatePlacement(uint64_t board, uint64_t pieceMask, int& outLinesCleared) {
                  uint64_t nextBoard = board | pieceMask, clearMask = 0ULL;
                  outLinesCleared = 0;
                  for (int r = 0; r < 8; ++r) {
                      uint64_t rowMask = 0xFFULL << (r * 8);
                      if ((nextBoard & rowMask) == rowMask) { clearMask |= rowMask; outLinesCleared++; }
                  }
                  for (int c = 0; c < 8; ++c) {
                      uint64_t colMask = 0x0101010101010101ULL << c;
                      if ((nextBoard & colMask) == colMask) { clearMask |= colMask; outLinesCleared++; }
                  }
                  return nextBoard & ~clearMask;
              }

              bool hasAnySingleValidMove(uint64_t board, const std::vector<PieceShape>& pieces) const {
                  for (const auto& p : pieces) {
                      if (!p.valid || p.rows <= 0 || p.cols <= 0 || p.localMask == 0) continue;
                      for (int r = 0; r <= 8 - p.rows; ++r)
                          for (int c = 0; c <= 8 - p.cols; ++c)
                              if ((board & computePlacementMask(p, r, c)) == 0ULL) return true;
                  }
                  return false;
              }

              TurnPlan solveTurn(uint64_t currentBoard, const std::vector<PieceShape>& availablePieces,
                                 int currentCombo, int movesSinceLastClear, PlayStrategy strategyMode) {
                  TurnPlan bestPlan;
                  std::vector<PieceShape> activePieces;
                  for (const auto& p : availablePieces)
                      if (p.valid && p.rows > 0 && p.cols > 0 && p.localMask != 0) activePieces.push_back(p);

                  int N = static_cast<int>(activePieces.size());
                  if (N == 0) return bestPlan;

                  int occupiedNow = popcount64(currentBoard);
                  int fit3x3Now = countFittingMasks(currentBoard, m_masks.square3x3);
                  PlayStrategy effectiveStrategy = strategyMode;
                  if (strategyMode == PlayStrategy::AUTO_MODE) {
                      effectiveStrategy = (occupiedNow >= 30 || fit3x3Now <= 2) ? PlayStrategy::MAX_SURVIVAL : PlayStrategy::AUTO_COMBO;
                  }
                  bestPlan.activeStrategy = effectiveStrategy;

                  std::vector<int> perm(N);
                  for (int i = 0; i < N; ++i) perm[i] = i;

                  struct SearchNode {
                      uint64_t board;
                      std::array<PlacementMove, 3> moves;
                      std::array<int, 3> clearAtStep;
                      int totalCleared = 0, survivalTier = 0;
                      double score = -1e18;
                  };

                  constexpr int BEAM_WIDTH = 120;
                  int totalValidFullSequences = 0, maxPartialDepth = 0;
                  TurnPlan fallbackPartialPlan;

                  do {
                      std::vector<SearchNode> currentBeam = {{currentBoard, {}, {0, 0, 0}, 0, 0, 0.0}};
                      for (int step = 0; step < N; ++step) {
                          const PieceShape& piece = activePieces[perm[step]];
                          std::vector<SearchNode> nextBeam;
                          nextBeam.reserve(currentBeam.size() * 32);
                          int maxR = 8 - piece.rows, maxC = 8 - piece.cols;

                          for (const auto& node : currentBeam) {
                              for (int r = 0; r <= maxR; ++r) {
                                  for (int c = 0; c <= maxC; ++c) {
                                      uint64_t mask = computePlacementMask(piece, r, c);
                                      if ((node.board & mask) != 0ULL) continue;
                                      int cleared = 0;
                                      uint64_t nextBoard = simulatePlacement(node.board, mask, cleared);
                                      SearchNode child = node;
                                      child.board = nextBoard;
                                      child.clearAtStep[step] = cleared;
                                      child.totalCleared = node.totalCleared + cleared;
                                      child.moves[step] = {piece.slotIndex, piece, r, c, mask, nextBoard, cleared, true};
                                      child.score = evaluateState(nextBoard, child.totalCleared, child.clearAtStep,
                                                                  step + 1, N, currentCombo, movesSinceLastClear,
                                                                  effectiveStrategy, child.survivalTier);
                                      nextBeam.push_back(child);
                                  }
                              }
                          }
                          if (nextBeam.empty()) { currentBeam.clear(); break; }

                          if (step + 1 >= maxPartialDepth) {
                              const auto& bestInterim = *std::max_element(nextBeam.begin(), nextBeam.end(),
                                  [](const SearchNode& a, const SearchNode& b) { return a.score < b.score; });
                              if (step + 1 > maxPartialDepth || bestInterim.score > fallbackPartialPlan.totalScore) {
                                  maxPartialDepth = step + 1;
                                  fallbackPartialPlan.moves.assign(bestInterim.moves.begin(), bestInterim.moves.begin() + (step + 1));
                                  fallbackPartialPlan.totalScore = bestInterim.score;
                                  fallbackPartialPlan.totalLinesCleared = bestInterim.totalCleared;
                                  fallbackPartialPlan.survivalTier = bestInterim.survivalTier;
                                  fallbackPartialPlan.feasible = true;
                              }
                          }
                          if (step < N - 1 && static_cast<int>(nextBeam.size()) > BEAM_WIDTH) {
                              std::partial_sort(nextBeam.begin(), nextBeam.begin() + BEAM_WIDTH, nextBeam.end(),
                                  [](const SearchNode& a, const SearchNode& b) { return a.score > b.score; });
                              nextBeam.resize(BEAM_WIDTH);
                          }
                          currentBeam = std::move(nextBeam);
                      }
                      totalValidFullSequences += static_cast<int>(currentBeam.size());
                      for (const auto& leaf : currentBeam) {
                          if (leaf.score > bestPlan.totalScore) {
                              bestPlan.totalScore = leaf.score;
                              bestPlan.totalLinesCleared = leaf.totalCleared;
                              bestPlan.survivalTier = leaf.survivalTier;
                              bestPlan.moves.assign(leaf.moves.begin(), leaf.moves.begin() + N);
                              bestPlan.feasible = true;
                          }
                      }
                  } while (std::next_permutation(perm.begin(), perm.end()));

                  if (!bestPlan.feasible && fallbackPartialPlan.feasible) bestPlan = fallbackPartialPlan;
                  bestPlan.validSequencesFound = totalValidFullSequences;
                  return bestPlan;
              }

          private:
              struct PrecomputedMasks {
                  std::vector<uint64_t> square3x3, square2x2, line5H, line5V, corner3x3;
              } m_masks;

              void initMasks() {
                  for (int r = 0; r <= 5; ++r)
                      for (int c = 0; c <= 5; ++c) {
                          uint64_t m = 0;
                          for (int dr = 0; dr < 3; ++dr)
                              for (int dc = 0; dc < 3; ++dc) m |= (1ULL << ((r + dr) * 8 + (c + dc)));
                          m_masks.square3x3.push_back(m);
                          uint64_t topRow = (7ULL << (r * 8 + c)), botRow = (7ULL << ((r + 2) * 8 + c));
                          uint64_t leftCol = (1ULL << (r * 8 + c)) | (1ULL << ((r + 1) * 8 + c)) | (1ULL << ((r + 2) * 8 + c));
                          uint64_t rightCol = (1ULL << (r * 8 + c + 2)) | (1ULL << ((r + 1) * 8 + c + 2)) | (1ULL << ((r + 2) * 8 + c + 2));
                          m_masks.corner3x3.push_back(topRow | leftCol);
                          m_masks.corner3x3.push_back(topRow | rightCol);
                          m_masks.corner3x3.push_back(botRow | leftCol);
                          m_masks.corner3x3.push_back(botRow | rightCol);
                      }
                  for (int r = 0; r <= 6; ++r)
                      for (int c = 0; c <= 6; ++c)
                          m_masks.square2x2.push_back((3ULL << (r * 8 + c)) | (3ULL << ((r + 1) * 8 + c)));
                  for (int r = 0; r < 8; ++r)
                      for (int c = 0; c <= 3; ++c) {
                          uint64_t m = 0;
                          for (int dc = 0; dc < 5; ++dc) m |= (1ULL << (r * 8 + (c + dc)));
                          m_masks.line5H.push_back(m);
                      }
                  for (int c = 0; c < 8; ++c)
                      for (int r = 0; r <= 3; ++r) {
                          uint64_t m = 0;
                          for (int dr = 0; dr < 5; ++dr) m |= (1ULL << ((r + dr) * 8 + c));
                          m_masks.line5V.push_back(m);
                      }
              }

              int countFittingMasks(uint64_t board, const std::vector<uint64_t>& masks) const {
                  int count = 0;
                  for (uint64_t m : masks) if ((board & m) == 0ULL) count++;
                  return count;
              }

              int countTransitions(uint64_t board) const {
                  int transitions = 0;
                  for (int r = 0; r < 8; ++r) {
                      uint8_t rowBits = static_cast<uint8_t>((board >> (r * 8)) & 0xFFULL);
                      uint8_t leftShifted = (rowBits << 1) | 1U;
                      uint8_t rightEdge = (rowBits & 0x80U) ? 0U : 1U;
                      transitions += __builtin_popcount(static_cast<unsigned int>(rowBits ^ leftShifted)) + rightEdge;
                  }
                  uint64_t topEdgeDiff = ~board & 0xFFULL, botEdgeDiff = (~board >> 56) & 0xFFULL;
                  uint64_t vertDiff = (board ^ (board << 8)) & ~0xFFULL;
                  return transitions + popcount64(vertDiff) + popcount64(topEdgeDiff) + popcount64(botEdgeDiff);
              }

              void analyzeEmptyRegions(uint64_t board, int& outIsolatedHoles, int& outSmallIslands, int& outLargestEmptyRegion) const {
                  uint64_t emptyMask = ~board, visited = 0ULL;
                  outIsolatedHoles = outSmallIslands = outLargestEmptyRegion = 0;
                  constexpr uint64_t NOT_LEFT_COL = 0xFEFEFEFEFEFEFEFEULL, NOT_RIGHT_COL = 0x7F7F7F7F7F7F7F7FULL;
                  while (emptyMask & ~visited) {
                      int startBit = __builtin_ctzll(emptyMask & ~visited);
                      uint64_t component = 1ULL << startBit;
                      while (true) {
                          uint64_t expanded = component | ((component << 1) & NOT_LEFT_COL) | ((component >> 1) & NOT_RIGHT_COL) | (component << 8) | (component >> 8);
                          expanded &= emptyMask;
                          if (expanded == component) break;
                          component = expanded;
                      }
                      visited |= component;
                      int regionSize = popcount64(component);
                      if (regionSize > outLargestEmptyRegion) outLargestEmptyRegion = regionSize;
                      if (regionSize == 1) outIsolatedHoles++;
                      else if (regionSize >= 2 && regionSize <= 4) outSmallIslands++;
                  }
              }

              double evaluateState(uint64_t finalBoard, int totalLinesCleared, const std::array<int, 3>& clearAtStep,
                                   int numSteps, int totalStepsInTurn, int initialCombo, int initialMovesSinceClear,
                                   PlayStrategy effectiveStrategy, int& outSurvivalTier) const {
                  int emptyCells = 64 - popcount64(finalBoard);
                  int isolatedHoles = 0, smallIslands = 0, largestEmptyRegion = 0;
                  analyzeEmptyRegions(finalBoard, isolatedHoles, smallIslands, largestEmptyRegion);

                  int fit3x3 = countFittingMasks(finalBoard, m_masks.square3x3);
                  int fit2x2 = countFittingMasks(finalBoard, m_masks.square2x2);
                  int fit5H  = countFittingMasks(finalBoard, m_masks.line5H);
                  int fit5V  = countFittingMasks(finalBoard, m_masks.line5V);
                  int fitL3  = countFittingMasks(finalBoard, m_masks.corner3x3);
                  int transitions = countTransitions(finalBoard);

                  int survivalTier = 1;
                  if (fit3x3 >= 2 && (fit5H + fit5V) >= 2 && fitL3 >= 4 && emptyCells >= 26 && isolatedHoles <= 3) survivalTier = 3;
                  else if (fit3x3 >= 1 && (fit5H + fit5V) >= 1 && fitL3 >= 2 && emptyCells >= 20 && isolatedHoles <= 5) survivalTier = 2;
                  else if (numSteps < totalStepsInTurn && emptyCells >= 24 && (fit3x3 >= 1 || fit2x2 >= 3)) survivalTier = 2;
                  outSurvivalTier = survivalTier;
                  double survivalScore = survivalTier * 1000000.0;

                  int totalMobility = fit3x3 * 4 + fit2x2 * 2 + (fit5H + fit5V) * 3 + fitL3;
                  double futureScore = totalMobility * 180.0 + emptyCells * 140.0 + largestEmptyRegion * 85.0
                                     - isolatedHoles * 920.0 - smallIslands * 580.0 - transitions * 52.0;
                  if (fit3x3 == 0) futureScore -= 35000.0;
                  if (fit5H == 0 && fit5V == 0) futureScore -= 22000.0;
                  if (fitL3 == 0) futureScore -= 18000.0;

                  int combo = initialCombo, drought = initialMovesSinceClear, comboExt = 0, lastClearIdx = -1;
                  bool comboBroken = false;
                  for (int s = 0; s < numSteps; ++s) {
                      if (clearAtStep[s] > 0) { combo++; drought = 0; comboExt++; lastClearIdx = s; }
                      else if (++drought >= 3 && combo > 0) { combo = 0; comboBroken = true; }
                  }
                  double comboWeight = (effectiveStrategy == PlayStrategy::AUTO_COMBO && survivalTier >= 2) ? 1.0 : 0.35;
                  double comboScore = (comboExt > 0)
                      ? (1600.0 * comboExt + std::min(combo, 15) * 180.0 + lastClearIdx * 350.0) * comboWeight
                      : (comboBroken ? -1400.0 * comboWeight : 0.0);

                  double rawScore = totalLinesCleared * 520.0;
                  for (int s = 0; s < numSteps; ++s)
                      if (clearAtStep[s] >= 2) rawScore += (clearAtStep[s] * clearAtStep[s]) * 380.0;

                  return survivalScore + futureScore + comboScore + rawScore;
              }
          };

          // 2. VISION ANALYZER: NHAN DIEN NEN XAM + TIM DUONG KHOI XEP CHO TRONG 3 GIAY
          struct VisionSnapshotResult {
              bool success = false;
              uint64_t boardBits = 0ULL;
              float boardConfidence = 0.0f;
              std::vector<PieceShape> dockPieces;
          };

          class VisionAnalyzer {
          public:
              struct RGBAPixel { uint8_t r, g, b, a; };

              static float computeColorDistance(float r1, float g1, float b1, float r2, float g2, float b2) {
                  float dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
                  return std::sqrt(dr * dr + dg * dg + db * db);
              }

              static float computeSaturation(float r, float g, float b) {
                  float mx = std::max({r, g, b}), mn = std::min({r, g, b});
                  return (mx < 1.0f) ? 0.0f : ((mx - mn) / mx);
              }

              static bool captureWindowPixels(UIWindow* gameWindow, UIWindow* overlayWindowToIgnore, int targetWidth, int& outHeight, std::vector<RGBAPixel>& outPixels) {
                  if (!gameWindow) return false;
                  __block int bufW = targetWidth, bufH = 0;
                  __block bool captured = false;
                  auto captureBlock = ^{
                      CGSize winSize = gameWindow.bounds.size;
                      if (winSize.width <= 0 || winSize.height <= 0) return;
                      bufH = static_cast<int>(std::round(bufW * (winSize.height / winSize.width)));
                      outPixels.resize(bufW * bufH);
                      UIGraphicsBeginImageContextWithOptions(CGSizeMake(bufW, bufH), NO, 1.0);
                      BOOL wasHidden = overlayWindowToIgnore ? overlayWindowToIgnore.hidden : YES;
                      if (overlayWindowToIgnore) overlayWindowToIgnore.hidden = YES;
                      [gameWindow drawViewHierarchyInRect:CGRectMake(0, 0, bufW, bufH) afterScreenUpdates:NO];
                      if (overlayWindowToIgnore) overlayWindowToIgnore.hidden = wasHidden;
                      UIImage* snapImage = UIGraphicsGetImageFromCurrentImageContext();
                      UIGraphicsEndImageContext();
                      if (!snapImage || !snapImage.CGImage) return;
                      CGColorSpaceRef colorSpace = CGColorSpaceCreateDeviceRGB();
                      CGContextRef ctx = CGBitmapContextCreate(outPixels.data(), bufW, bufH, 8, bufW * 4, colorSpace, kCGImageAlphaPremultipliedLast | kCGBitmapByteOrder32Big);
                      CGContextDrawImage(ctx, CGRectMake(0, 0, bufW, bufH), snapImage.CGImage);
                      CGContextRelease(ctx);
                      CGColorSpaceRelease(colorSpace);
                      captured = true;
                  };
                  if ([NSThread isMainThread]) captureBlock();
                  else dispatch_sync(dispatch_get_main_queue(), captureBlock);
                  outHeight = bufH;
                  return captured && !outPixels.empty() && bufH > 0;
              }

              PieceShape recognizeDockSlot(const std::vector<RGBAPixel>& buffer, int bufW, int bufH, int slotIndex,
                                           float slotNormX, float slotNormY, float slotNormW, float slotNormH, float expectedDockCellPx) {
                  PieceShape shape;
                  shape.slotIndex = slotIndex;
                  int x0 = std::max(0, static_cast<int>(std::round(slotNormX * bufW)));
                  int y0 = std::max(0, static_cast<int>(std::round(slotNormY * bufH)));
                  int x1 = std::min(bufW - 1, static_cast<int>(std::round((slotNormX + slotNormW) * bufW)));
                  int y1 = std::min(bufH - 1, static_cast<int>(std::round((slotNormY + slotNormH) * bufH)));
                  if (x1 <= x0 + 6 || y1 <= y0 + 6) return shape;

                  float sumBgR = 0, sumBgG = 0, sumBgB = 0; int bgSamples = 0;
                  for (int x = x0 + 3; x <= x1 - 3; x += 4) {
                      const RGBAPixel& pTop = buffer[(y0 + 3) * bufW + x];
                      const RGBAPixel& pBot = buffer[(y1 - 3) * bufW + x];
                      sumBgR += pTop.r + pBot.r; sumBgG += pTop.g + pBot.g; sumBgB += pTop.b + pBot.b;
                      bgSamples += 2;
                  }
                  float bgR = bgSamples ? sumBgR / bgSamples : 43.0f, bgG = bgSamples ? sumBgG / bgSamples : 62.0f, bgB = bgSamples ? sumBgB / bgSamples : 129.0f;
                  constexpr float DOCK_FG_DIST_THRESHOLD = 28.0f;
                  int minFgX = x1, maxFgX = x0, minFgY = y1, maxFgY = y0, fgCount = 0;
                  float sumFgR = 0, sumFgG = 0, sumFgB = 0;

                  for (int y = y0 + 4; y <= y1 - 4; ++y)
                      for (int x = x0 + 4; x <= x1 - 4; ++x) {
                          const RGBAPixel& px = buffer[y * bufW + x];
                          if (computeColorDistance(px.r, px.g, px.b, bgR, bgG, bgB) > DOCK_FG_DIST_THRESHOLD) {
                              minFgX = std::min(minFgX, x); maxFgX = std::max(maxFgX, x);
                              minFgY = std::min(minFgY, y); maxFgY = std::max(maxFgY, y);
                              sumFgR += px.r; sumFgG += px.g; sumFgB += px.b;
                              fgCount++;
                          }
                      }

                  float fgBoxW = static_cast<float>(maxFgX - minFgX + 1), fgBoxH = static_cast<float>(maxFgY - minFgY + 1);
                  if (fgCount < 18 || fgBoxW < expectedDockCellPx * 0.50f || fgBoxH < expectedDockCellPx * 0.50f) return shape;

                  shape.colorR = sumFgR / fgCount;
                  shape.colorG = sumFgG / fgCount;
                  shape.colorB = sumFgB / fgCount;
                  shape.cols = std::clamp(static_cast<int>(std::round(fgBoxW / expectedDockCellPx)), 1, 5);
                  shape.rows = std::clamp(static_cast<int>(std::round(fgBoxH / expectedDockCellPx)), 1, 5);
                  float cellStepW = fgBoxW / shape.cols, cellStepH = fgBoxH / shape.rows;

                  for (int r = 0; r < shape.rows; ++r) {
                      for (int c = 0; c < shape.cols; ++c) {
                          int cx = static_cast<int>(std::round(minFgX + (c + 0.5f) * cellStepW));
                          int cy = static_cast<int>(std::round(minFgY + (r + 0.5f) * cellStepH));
                          int activeSamples = 0, totalSamples = 0, radius = std::max(2, static_cast<int>(std::min(cellStepW, cellStepH) * 0.28f));
                          for (int dy = -radius; dy <= radius; ++dy)
                              for (int dx = -radius; dx <= radius; ++dx) {
                                  totalSamples++;
                                  const RGBAPixel& px = buffer[std::clamp(cy + dy, y0, y1) * bufW + std::clamp(cx + dx, x0, x1)];
                                  if (computeColorDistance(px.r, px.g, px.b, bgR, bgG, bgB) > DOCK_FG_DIST_THRESHOLD) activeSamples++;
                              }
                          if (activeSamples * 10 >= totalSamples * 3) { shape.setCell(r, c, true); shape.cellCount++; }
                      }
                  }
                  shape.valid = (shape.cellCount > 0);
                  shape.centerNormX = ((minFgX + maxFgX) * 0.5f) / bufW;
                  shape.centerNormY = ((minFgY + maxFgY) * 0.5f) / bufH;
                  return shape;
              }

              VisionSnapshotResult analyzePixels(const std::vector<RGBAPixel>& pixels, int bufW, int bufH, const CalibrationConfig& config) {
                  VisionSnapshotResult result;
                  if (pixels.empty() || bufW <= 0 || bufH <= 0) return result;

                  float outerX = config.boardX * bufW, outerY = config.boardY * bufH, outerW = config.boardW * bufW;
                  float borderPad = outerW * config.gridBorderRatio;
                  float gridX = outerX + borderPad, gridY = outerY + borderPad, gridW = outerW - 2.0f * borderPad;
                  float cellW = gridW / 8.0f, cellH = gridW / 8.0f;

                  struct CellFeatures {
                      float r, g, b, lum, sat, innerStdDev, bevelRelief, flatnessMetric;
                  };
                  std::array<CellFeatures, 64> feats;

                  for (int r = 0; r < 8; ++r) {
                      for (int c = 0; c < 8; ++c) {
                          float xStart = gridX + c * cellW, yStart = gridY + r * cellH;
                          int cx = static_cast<int>(std::round(xStart + 0.5f * cellW));
                          int cy = static_cast<int>(std::round(yStart + 0.5f * cellH));

                          float sumR = 0, sumG = 0, sumB = 0, sumLum = 0, sumLumSq = 0;
                          int cnt = 0, coreRad = std::max(2, static_cast<int>(cellW * 0.18f));
                          for (int dy = -coreRad; dy <= coreRad; ++dy) {
                              for (int dx = -coreRad; dx <= coreRad; ++dx) {
                                  const RGBAPixel& p = pixels[std::clamp(cy + dy, 0, bufH - 1) * bufW + std::clamp(cx + dx, 0, bufW - 1)];
                                  float l = 0.299f * p.r + 0.587f * p.g + 0.114f * p.b;
                                  sumR += p.r; sumG += p.g; sumB += p.b;
                                  sumLum += l; sumLumSq += l * l; cnt++;
                              }
                          }
                          float avgR = sumR / cnt, avgG = sumG / cnt, avgB = sumB / cnt, avgLum = sumLum / cnt;
                          float innerStd = std::sqrt(std::max(0.0f, (sumLumSq / cnt) - (avgLum * avgLum)));
                          float sat = computeSaturation(avgR, avgG, avgB);

                          int tlX = std::clamp(static_cast<int>(std::round(xStart + 0.18f * cellW)), 0, bufW - 1);
                          int tlY = std::clamp(static_cast<int>(std::round(yStart + 0.18f * cellH)), 0, bufH - 1);
                          int brX = std::clamp(static_cast<int>(std::round(xStart + 0.82f * cellW)), 0, bufW - 1);
                          int brY = std::clamp(static_cast<int>(std::round(yStart + 0.82f * cellH)), 0, bufH - 1);

                          float tlLum = 0, brLum = 0; int bCnt = 0;
                          for (int d = -2; d <= 2; ++d) {
                              const RGBAPixel& pTL = pixels[tlY * bufW + std::clamp(tlX + d, 0, bufW - 1)];
                              const RGBAPixel& pBR = pixels[brY * bufW + std::clamp(brX + d, 0, bufW - 1)];
                              tlLum += 0.299f * pTL.r + 0.587f * pTL.g + 0.114f * pTL.b;
                              brLum += 0.299f * pBR.r + 0.587f * pBR.g + 0.114f * pBR.b;
                              bCnt++;
                          }
                          tlLum /= bCnt; brLum /= bCnt;
                          float bevelRelief = std::abs(tlLum - brLum) + std::abs(tlLum - avgLum) * 0.5f;
                          float flatness = innerStd * 1.6f + bevelRelief * 1.1f + sat * 38.0f;
                          feats[r * 8 + c] = {avgR, avgG, avgB, avgLum, sat, innerStd, bevelRelief, flatness};
                      }
                  }

                  std::array<CellFeatures, 64> sortedByFlatness = feats;
                  std::sort(sortedByFlatness.begin(), sortedByFlatness.end(),
                      [](const CellFeatures& a, const CellFeatures& b) { return a.flatnessMetric < b.flatnessMetric; });

                  float bgRefR = 0, bgRefG = 0, bgRefB = 0, bgRefLum = 0, bgRefSat = 0;
                  int clusterCount = 0;
                  const CellFeatures& flattest = sortedByFlatness[0];
                  for (int i = 0; i < 24; ++i) {
                      const auto& cf = sortedByFlatness[i];
                      if (i == 0 || (computeColorDistance(cf.r, cf.g, cf.b, flattest.r, flattest.g, flattest.b) < 22.0f && cf.bevelRelief < 18.0f)) {
                          bgRefR += cf.r; bgRefG += cf.g; bgRefB += cf.b;
                          bgRefLum += cf.lum; bgRefSat += cf.sat;
                          clusterCount++;
                      }
                  }
                  bgRefR /= clusterCount; bgRefG /= clusterCount; bgRefB /= clusterCount;
                  bgRefLum /= clusterCount; bgRefSat /= clusterCount;

                  uint64_t boardBits = 0ULL;
                  float confidenceSum = 0.0f;
                  for (int i = 0; i < 64; ++i) {
                      const auto& f = feats[i];
                      float colorDist = computeColorDistance(f.r, f.g, f.b, bgRefR, bgRefG, bgRefB);
                      float lumDiff = std::abs(f.lum - bgRefLum);
                      float satDiff = std::max(0.0f, f.sat - bgRefSat);
                      float occupancyScore = colorDist * 0.85f + lumDiff * 0.45f + f.bevelRelief * 1.25f + satDiff * 55.0f;
                      if ((occupancyScore >= 46.0f) && (colorDist >= 26.0f || f.bevelRelief >= 14.0f || satDiff >= 0.22f))
                          boardBits |= (1ULL << i);
                      confidenceSum += std::clamp(std::abs(occupancyScore - 46.0f) / 46.0f, 0.2f, 1.0f);
                  }

                  if (popcount64(boardBits) >= 60) {
                      float maxColorSpread = 0.0f;
                      for (int i = 0; i < 64; ++i)
                          maxColorSpread = std::max(maxColorSpread, computeColorDistance(feats[i].r, feats[i].g, feats[i].b, bgRefR, bgRefG, bgRefB));
                      if (maxColorSpread < 28.0f) boardBits = 0ULL;
                  }

                  float expectedDockCellPx = cellW * config.dockCellScale, slotW = config.dockW / 3.0f;
                  result.dockPieces.resize(3);
                  for (int s = 0; s < 3; ++s)
                      result.dockPieces[s] = recognizeDockSlot(pixels, bufW, bufH, s, config.dockX + s * slotW, config.dockY, slotW, config.dockH, expectedDockCellPx);

                  result.boardBits = boardBits;
                  result.boardConfidence = confidenceSum / 64.0f;
                  result.success = true;
                  return result;
              }

              VisionSnapshotResult analyzeCurrentScreen(UIWindow* gameWindow, UIWindow* overlayWindowToIgnore, const CalibrationConfig& config) {
                  int bufW = 360, bufH = 0;
                  std::vector<RGBAPixel> pixels;
                  if (!captureWindowPixels(gameWindow, overlayWindowToIgnore, bufW, bufH, pixels)) return {};
                  return analyzePixels(pixels, bufW, bufH, config);
              }

              // Quet toan bo ban co 8x8 de tim vi tri thuc te cua khoi xep cho dang duoc keo tren man hinh
              bool detectHeldPieceOnBoard(const std::vector<RGBAPixel>& preDragPixels, const std::vector<RGBAPixel>& liveHoldPixels,
                                          int bufW, int bufH, uint64_t preBoardBits, const CalibrationConfig& config,
                                          const PlacementMove& targetMove, int& outDetectedRow, int& outDetectedCol) {
                  if (preDragPixels.size() != liveHoldPixels.size() || preDragPixels.empty()) return false;
                  float outerX = config.boardX * bufW, outerY = config.boardY * bufH, outerW = config.boardW * bufW;
                  float borderPad = outerW * config.gridBorderRatio;
                  float gridX = outerX + borderPad, gridY = outerY + borderPad, gridW = outerW - 2.0f * borderPad;
                  float cellW = gridW / 8.0f, cellH = gridW / 8.0f;

                  float cellActivity[8][8] = {{0}};
                  int sampleRad = std::max(2, static_cast<int>(cellW * 0.24f));

                  for (int r = 0; r < 8; ++r) {
                      for (int c = 0; c < 8; ++c) {
                          int cx = static_cast<int>(std::round(gridX + (c + 0.5f) * cellW));
                          int cy = static_cast<int>(std::round(gridY + (r + 0.5f) * cellH));
                          float diffSum = 0.0f, colorMatchSum = 0.0f; int cnt = 0;
                          for (int dy = -sampleRad; dy <= sampleRad; ++dy) {
                              for (int dx = -sampleRad; dx <= sampleRad; ++dx) {
                                  int idx = std::clamp(cy + dy, 0, bufH - 1) * bufW + std::clamp(cx + dx, 0, bufW - 1);
                                  const RGBAPixel& p0 = preDragPixels[idx];
                                  const RGBAPixel& p1 = liveHoldPixels[idx];
                                  float dPre = computeColorDistance(p0.r, p0.g, p0.b, p1.r, p1.g, p1.b);
                                  float dPiece = computeColorDistance(p1.r, p1.g, p1.b, targetMove.piece.colorR, targetMove.piece.colorG, targetMove.piece.colorB);
                                  diffSum += dPre;
                                  if (dPiece < 72.0f) colorMatchSum += (72.0f - dPiece) * 0.65f;
                                  cnt++;
                              }
                          }
                          bool wasEmpty = (((preBoardBits >> (r * 8 + c)) & 1ULL) == 0ULL);
                          float weight = wasEmpty ? 1.25f : 0.45f; // Uu tien o trong de khong bi nham voi hieu ung nhay sang cua hang sap xoa
                          cellActivity[r][c] = ((diffSum + colorMatchSum) / std::max(1, cnt)) * weight;
                      }
                  }

                  int maxR = 8 - targetMove.piece.rows, maxC = 8 - targetMove.piece.cols;
                  float bestScore = -1e9f; int bestR = -1, bestC = -1;

                  for (int r = 0; r <= maxR; ++r) {
                      for (int c = 0; c <= maxC; ++c) {
                          float insideSum = 0.0f, haloSum = 0.0f; int insideCnt = 0, haloCnt = 0;
                          for (int dr = -1; dr <= targetMove.piece.rows; ++dr) {
                              for (int dc = -1; dc <= targetMove.piece.cols; ++dc) {
                                  int br = r + dr, bc = c + dc;
                                  if (br < 0 || br >= 8 || bc < 0 || bc >= 8) continue;
                                  bool inMask = (dr >= 0 && dr < targetMove.piece.rows && dc >= 0 && dc < targetMove.piece.cols && targetMove.piece.getCell(dr, dc));
                                  if (inMask) { insideSum += cellActivity[br][bc]; insideCnt++; }
                                  else { haloSum += cellActivity[br][bc]; haloCnt++; }
                              }
                          }
                          float score = (insideSum / std::max(1, insideCnt)) - (haloSum / std::max(1, haloCnt)) * 0.55f;
                          if (score > bestScore) { bestScore = score; bestR = r; bestC = c; }
                      }
                  }
                  outDetectedRow = bestR; outDetectedCol = bestC;
                  return (bestR >= 0 && bestC >= 0 && bestScore >= 14.0f);
              }
          };


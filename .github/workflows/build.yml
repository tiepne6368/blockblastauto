name: Build BlockBlastAuto Dylib

on:
  push:
    paths-ignore:
      - 'BlockBlastAuto.dylib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid signer
        run: brew install ldid

      - name: Write and Compile BlockBlastAuto.mm
        run: |
          cat << 'EOF' > BlockBlastAuto.mm
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #include <cstdint>
          #include <vector>
          #include <array>
          #include <string>
          #include <algorithm>
          #include <cmath>
          #include <atomic>

          namespace BBAuto {

          enum class PlayStrategy : int { AUTO_COMBO = 0, MAX_SURVIVAL = 1, AUTO_MODE = 2 };
          enum class EngineRunState : int { STOPPED = 0, AUTO_PLAYING = 1, GUIDE_PLAYING = 2 };

          struct PieceShape {
              int slotIndex = -1, rows = 0, cols = 0, cellCount = 0;
              uint32_t localMask = 0;
              bool valid = false;
              float centerNormX = 0.0f, centerNormY = 0.0f;

              bool getCell(int r, int c) const {
                  if (r < 0 || r >= rows || c < 0 || c >= cols) return false;
                  return (localMask >> (r * 5 + c)) & 1U;
              }
              void setCell(int r, int c, bool val) {
                  if (r < 0 || r >= 5 || c < 0 || c >= 5) return;
                  if (val) localMask |= (1U << (r * 5 + c));
                  else localMask &= ~(1U << (r * 5 + c));
              }
          };

          struct PlacementMove {
              int slotIndex = -1;
              PieceShape piece;
              int targetRow = 0, targetCol = 0;
              uint64_t rawMaskOnBoard = 0ULL, expectedBoardAfter = 0ULL;
              int linesCleared = 0;
              bool valid = false;
          };

          struct TurnPlan {
              std::vector<PlacementMove> moves;
              double totalScore = -1e18;
              int totalLinesCleared = 0, validSequencesFound = 0;
              PlayStrategy activeStrategy = PlayStrategy::AUTO_MODE;
              bool feasible = false;
          };

          struct CalibrationConfig {
              float boardX = 0.054f, boardY = 0.235f, boardW = 0.892f;
              float dockX = 0.035f, dockY = 0.686f, dockW = 0.930f, dockH = 0.160f;
              float dockCellScale = 0.45f, dragLiftOffsetY = 90.0f, dragSpeedMultiplier = 0.7f;
              float dragGainX = 1.45f, dragGainY = 1.45f;
              bool showCalibrationOverlay = false;
          };

          struct RuntimeTelemetry {
              int turnsExecuted = 0, movesExecuted = 0, totalLinesCleared = 0;
              int currentCombo = 0, movesSinceLastClear = 0, lastValidSequences = 0;
              uint64_t lastDetectedBoard = 0ULL;
              std::array<PieceShape, 3> lastDetectedDock;
              bool hasActiveGuideMove = false;
              PlacementMove currentGuideMove, nextGuideMove;
              int guideStepIndex = 0, guideTotalSteps = 0;
              PlayStrategy requestedStrategy = PlayStrategy::AUTO_MODE;
              PlayStrategy effectiveStrategy = PlayStrategy::AUTO_COMBO;
              std::string statusMessage = "San sang";
          };

          inline int popcount64(uint64_t x) { return __builtin_popcountll(x); }

          class BlockSolver {
          public:
              BlockSolver() { initThreatMasks(); }

              static uint64_t computePlacementMask(const PieceShape& piece, int targetRow, int targetCol) {
                  uint64_t mask = 0ULL;
                  for (int r = 0; r < piece.rows; ++r)
                      for (int c = 0; c < piece.cols; ++c)
                          if (piece.getCell(r, c))
                              mask |= (1ULL << ((targetRow + r) * 8 + (targetCol + c)));
                  return mask;
              }

              static uint64_t simulatePlacement(uint64_t board, uint64_t pieceMask, int& outLinesCleared) {
                  uint64_t nextBoard = board | pieceMask;
                  uint64_t clearMask = 0ULL;
                  outLinesCleared = 0;
                  for (int r = 0; r < 8; ++r) {
                      uint64_t rowMask = 0xFFULL << (r * 8);
                      if ((nextBoard & rowMask) == rowMask) { clearMask |= rowMask; outLinesCleared++; }
                  }
                  for (int c = 0; c < 8; ++c) {
                      uint64_t colMask = 0x0101010101010101ULL << c;
                      if ((nextBoard & colMask) == colMask) { clearMask |= colMask; outLinesCleared++; }
                  }
                  return nextBoard & ~clearMask;
              }

              TurnPlan solveTurn(uint64_t currentBoard, const std::vector<PieceShape>& availablePieces,
                                 int currentCombo, int movesSinceLastClear, PlayStrategy strategyMode) {
                  TurnPlan bestPlan;
                  std::vector<PieceShape> activePieces;
                  for (const auto& p : availablePieces)
                      if (p.valid && p.rows > 0 && p.cols > 0 && p.localMask != 0) activePieces.push_back(p);

                  int N = static_cast<int>(activePieces.size());
                  if (N == 0) return bestPlan;

                  PlayStrategy effectiveStrategy = strategyMode;
                  if (strategyMode == PlayStrategy::AUTO_MODE) {
                      int occupied = popcount64(currentBoard);
                      int currentFit3x3 = countFittingMasks(currentBoard, m_threatMasks.square3x3);
                      effectiveStrategy = (occupied >= 38 || currentFit3x3 <= 1) ? PlayStrategy::MAX_SURVIVAL : PlayStrategy::AUTO_COMBO;
                  }
                  bestPlan.activeStrategy = effectiveStrategy;

                  std::vector<int> perm(N);
                  for (int i = 0; i < N; ++i) perm[i] = i;

                  struct SearchNode {
                      uint64_t board;
                      std::array<PlacementMove, 3> moves;
                      std::array<int, 3> clearAtStep;
                      int totalCleared = 0;
                      double interimScore = 0.0;
                  };

                  constexpr int BEAM_WIDTH = 96;
                  int totalValidFullSequences = 0;
                  TurnPlan fallbackPartialPlan;
                  int maxPartialDepth = 0;

                  do {
                      std::vector<SearchNode> currentBeam = {{currentBoard, {}, {0, 0, 0}, 0, 0.0}};
                      for (int step = 0; step < N; ++step) {
                          const PieceShape& piece = activePieces[perm[step]];
                          std::vector<SearchNode> nextBeam;
                          nextBeam.reserve(currentBeam.size() * 32);
                          int maxR = 8 - piece.rows, maxC = 8 - piece.cols;

                          for (const auto& node : currentBeam) {
                              for (int r = 0; r <= maxR; ++r) {
                                  for (int c = 0; c <= maxC; ++c) {
                                      uint64_t mask = computePlacementMask(piece, r, c);
                                      if ((node.board & mask) != 0ULL) continue;
                                      int cleared = 0;
                                      uint64_t nextBoard = simulatePlacement(node.board, mask, cleared);
                                      SearchNode child = node;
                                      child.board = nextBoard;
                                      child.clearAtStep[step] = cleared;
                                      child.totalCleared = node.totalCleared + cleared;
                                      child.moves[step] = {piece.slotIndex, piece, r, c, mask, nextBoard, cleared, true};
                                      child.interimScore = evaluateState(nextBoard, child.totalCleared, child.clearAtStep,
                                                                         step + 1, currentCombo, movesSinceLastClear, effectiveStrategy);
                                      nextBeam.push_back(child);
                                  }
                              }
                          }
                          if (nextBeam.empty()) { currentBeam.clear(); break; }
                          if (step + 1 > maxPartialDepth) {
                              maxPartialDepth = step + 1;
                              const auto& bestInterim = *std::max_element(nextBeam.begin(), nextBeam.end(),
                                  [](const SearchNode& a, const SearchNode& b) { return a.interimScore < b.interimScore; });
                              fallbackPartialPlan.moves.assign(bestInterim.moves.begin(), bestInterim.moves.begin() + (step + 1));
                              fallbackPartialPlan.totalScore = bestInterim.interimScore;
                              fallbackPartialPlan.totalLinesCleared = bestInterim.totalCleared;
                              fallbackPartialPlan.feasible = true;
                          }
                          if (step < N - 1 && static_cast<int>(nextBeam.size()) > BEAM_WIDTH) {
                              std::partial_sort(nextBeam.begin(), nextBeam.begin() + BEAM_WIDTH, nextBeam.end(),
                                  [](const SearchNode& a, const SearchNode& b) { return a.interimScore > b.interimScore; });
                              nextBeam.resize(BEAM_WIDTH);
                          }
                          currentBeam = std::move(nextBeam);
                      }
                      totalValidFullSequences += static_cast<int>(currentBeam.size());
                      for (const auto& leaf : currentBeam) {
                          if (leaf.interimScore > bestPlan.totalScore) {
                              bestPlan.totalScore = leaf.interimScore;
                              bestPlan.totalLinesCleared = leaf.totalCleared;
                              bestPlan.moves.assign(leaf.moves.begin(), leaf.moves.begin() + N);
                              bestPlan.feasible = true;
                          }
                      }
                  } while (std::next_permutation(perm.begin(), perm.end()));

                  if (!bestPlan.feasible && fallbackPartialPlan.feasible) bestPlan = fallbackPartialPlan;
                  bestPlan.validSequencesFound = totalValidFullSequences;
                  return bestPlan;
              }

          private:
              struct PrecomputedThreatMasks {
                  std::vector<uint64_t> square3x3, line5H, line5V, corner3x3;
              } m_threatMasks;

              void initThreatMasks() {
                  for (int r = 0; r <= 5; ++r)
                      for (int c = 0; c <= 5; ++c) {
                          uint64_t m = 0;
                          for (int dr = 0; dr < 3; ++dr)
                              for (int dc = 0; dc < 3; ++dc) m |= (1ULL << ((r + dr) * 8 + (c + dc)));
                          m_threatMasks.square3x3.push_back(m);
                          uint64_t topRow = (7ULL << (r * 8 + c)), botRow = (7ULL << ((r + 2) * 8 + c));
                          uint64_t leftCol = (1ULL << (r * 8 + c)) | (1ULL << ((r + 1) * 8 + c)) | (1ULL << ((r + 2) * 8 + c));
                          uint64_t rightCol = (1ULL << (r * 8 + c + 2)) | (1ULL << ((r + 1) * 8 + c + 2)) | (1ULL << ((r + 2) * 8 + c + 2));
                          m_threatMasks.corner3x3.push_back(topRow | leftCol);
                          m_threatMasks.corner3x3.push_back(topRow | rightCol);
                          m_threatMasks.corner3x3.push_back(botRow | leftCol);
                          m_threatMasks.corner3x3.push_back(botRow | rightCol);
                      }
                  for (int r = 0; r < 8; ++r)
                      for (int c = 0; c <= 3; ++c) {
                          uint64_t m = 0;
                          for (int dc = 0; dc < 5; ++dc) m |= (1ULL << (r * 8 + (c + dc)));
                          m_threatMasks.line5H.push_back(m);
                      }
                  for (int r = 0; r <= 3; ++r)
                      for (int c = 0; c < 8; ++c) {
                          uint64_t m = 0;
                          for (int dr = 0; dr < 5; ++dr) m |= (1ULL << ((r + dr) * 8 + c));
                          m_threatMasks.line5V.push_back(m);
                      }
              }

              int countFittingMasks(uint64_t board, const std::vector<uint64_t>& masks) const {
                  int count = 0;
                  for (uint64_t m : masks) if ((board & m) == 0ULL) count++;
                  return count;
              }

              int countTransitions(uint64_t board) const {
                  int transitions = 0;
                  for (int r = 0; r < 8; ++r) {
                      uint8_t rowBits = static_cast<uint8_t>((board >> (r * 8)) & 0xFFULL);
                      uint8_t leftShifted = (rowBits << 1) | 1U;
                      uint8_t rightEdge = (rowBits & 0x80U) ? 0U : 1U;
                      transitions += __builtin_popcount(static_cast<unsigned int>(rowBits ^ leftShifted)) + rightEdge;
                  }
                  uint64_t topEdgeDiff = ~board & 0xFFULL, botEdgeDiff = (~board >> 56) & 0xFFULL;
                  uint64_t vertDiff = (board ^ (board << 8)) & ~0xFFULL;
                  return transitions + popcount64(vertDiff) + popcount64(topEdgeDiff) + popcount64(botEdgeDiff);
              }

              void analyzeEmptyRegions(uint64_t board, int& outIsolatedHoles, int& outSmallIslands, int& outLargestEmptyRegion) const {
                  uint64_t emptyMask = ~board, visited = 0ULL;
                  outIsolatedHoles = outSmallIslands = outLargestEmptyRegion = 0;
                  constexpr uint64_t NOT_LEFT_COL = 0xFEFEFEFEFEFEFEFEULL, NOT_RIGHT_COL = 0x7F7F7F7F7F7F7F7FULL;
                  while (emptyMask & ~visited) {
                      int startBit = __builtin_ctzll(emptyMask & ~visited);
                      uint64_t component = 1ULL << startBit;
                      while (true) {
                          uint64_t expanded = component | ((component << 1) & NOT_LEFT_COL) | ((component >> 1) & NOT_RIGHT_COL) | (component << 8) | (component >> 8);
                          expanded &= emptyMask;
                          if (expanded == component) break;
                          component = expanded;
                      }
                      visited |= component;
                      int regionSize = popcount64(component);
                      if (regionSize > outLargestEmptyRegion) outLargestEmptyRegion = regionSize;
                      if (regionSize == 1) outIsolatedHoles++;
                      else if (regionSize >= 2 && regionSize <= 4) outSmallIslands++;
                  }
              }

              double evaluateState(uint64_t finalBoard, int totalLinesCleared, const std::array<int, 3>& clearAtStep,
                                   int numSteps, int initialCombo, int initialMovesSinceClear, PlayStrategy effectiveStrategy) const {
                  int occupiedCells = popcount64(finalBoard), emptyCells = 64 - occupiedCells;
                  int combo = initialCombo, drought = initialMovesSinceClear, comboExtensions = 0, lastClearStepIndex = -1;
                  bool comboBroken = false;
                  for (int s = 0; s < numSteps; ++s) {
                      if (clearAtStep[s] > 0) { combo++; drought = 0; comboExtensions++; lastClearStepIndex = s; }
                      else if (++drought >= 3 && combo > 0) { combo = 0; comboBroken = true; }
                  }
                  int isolatedHoles = 0, smallIslands = 0, largestEmptyRegion = 0;
                  analyzeEmptyRegions(finalBoard, isolatedHoles, smallIslands, largestEmptyRegion);
                  int transitions = countTransitions(finalBoard);
                  int fit3x3 = countFittingMasks(finalBoard, m_threatMasks.square3x3);
                  int fit5H  = countFittingMasks(finalBoard, m_threatMasks.line5H);
                  int fit5V  = countFittingMasks(finalBoard, m_threatMasks.line5V);
                  int fitL3  = countFittingMasks(finalBoard, m_threatMasks.corner3x3);

                  int primedLines = 0;
                  for (int i = 0; i < 8; ++i) {
                      int cntR = popcount64((finalBoard >> (i * 8)) & 0xFFULL);
                      int cntC = popcount64(finalBoard & (0x0101010101010101ULL << i));
                      primedLines += (cntR == 7 ? 3 : (cntR == 6 ? 1 : 0)) + (cntC == 7 ? 3 : (cntC == 6 ? 1 : 0));
                  }

                  bool isCombo = (effectiveStrategy == PlayStrategy::AUTO_COMBO);
                  double score = 0.0;
                  if (comboExtensions > 0) score += (isCombo ? 2600.0 : 950.0) * comboExtensions + (combo * 320.0) + lastClearStepIndex * (isCombo ? 650.0 : 220.0);
                  else if (comboBroken) score -= (isCombo ? 3200.0 : 900.0);

                  score += totalLinesCleared * (isCombo ? 820.0 : 1150.0);
                  for (int s = 0; s < numSteps; ++s)
                      if (clearAtStep[s] >= 2) score += (clearAtStep[s] * clearAtStep[s]) * (isCombo ? 550.0 : 750.0);

                  score += emptyCells * (isCombo ? 38.0 : 75.0) + largestEmptyRegion * 22.0;
                  score -= isolatedHoles * (isCombo ? 360.0 : 580.0) + smallIslands * (isCombo ? 240.0 : 420.0) + transitions * (isCombo ? 28.0 : 45.0);
                  score += primedLines * (isCombo ? 95.0 : 40.0);

                  if (fit3x3 == 0) score -= isCombo ? 2400.0 : 4500.0; else score += std::min(fit3x3, 6) * 140.0;
                  if (fit5H == 0 && fit5V == 0) score -= isCombo ? 1500.0 : 2800.0; else score += std::min(fit5H + fit5V, 8) * 65.0;
                  if (fitL3 == 0) score -= 1600.0; else score += std::min(fitL3, 8) * 45.0;
                  return score;
              }
          };

          struct VisionSnapshotResult {
              bool success = false;
              uint64_t boardBits = 0ULL;
              std::vector<PieceShape> dockPieces;
          };

          class VisionAnalyzer {
          public:
              struct RGBAPixel { uint8_t r, g, b, a; };

              static float computeColorDistance(const RGBAPixel& px, float bgR, float bgG, float bgB) {
                  float dr = px.r - bgR, dg = px.g - bgG, db = px.b - bgB;
                  return std::sqrt(dr * dr + dg * dg + db * db);
              }

              static bool captureWindowPixels(UIWindow* gameWindow, UIWindow* overlayWindowToIgnore, int targetWidth, int& outHeight, std::vector<RGBAPixel>& outPixels) {
                  if (!gameWindow) return false;
                  __block int bufW = targetWidth, bufH = 0;
                  __block bool captured = false;
                  auto captureBlock = ^{
                      CGSize winSize = gameWindow.bounds.size;
                      if (winSize.width <= 0 || winSize.height <= 0) return;
                      bufH = static_cast<int>(std::round(bufW * (winSize.height / winSize.width)));
                      outPixels.resize(bufW * bufH);
                      UIGraphicsBeginImageContextWithOptions(CGSizeMake(bufW, bufH), NO, 1.0);
                      BOOL wasHidden = overlayWindowToIgnore ? overlayWindowToIgnore.hidden : YES;
                      if (overlayWindowToIgnore) overlayWindowToIgnore.hidden = YES;
                      [gameWindow drawViewHierarchyInRect:CGRectMake(0, 0, bufW, bufH) afterScreenUpdates:NO];
                      if (overlayWindowToIgnore) overlayWindowToIgnore.hidden = wasHidden;
                      UIImage* snapImage = UIGraphicsGetImageFromCurrentImageContext();
                      UIGraphicsEndImageContext();
                      if (!snapImage || !snapImage.CGImage) return;
                      CGColorSpaceRef colorSpace = CGColorSpaceCreateDeviceRGB();
                      CGContextRef ctx = CGBitmapContextCreate(outPixels.data(), bufW, bufH, 8, bufW * 4, colorSpace, kCGImageAlphaPremultipliedLast | kCGBitmapByteOrder32Big);
                      CGContextDrawImage(ctx, CGRectMake(0, 0, bufW, bufH), snapImage.CGImage);
                      CGContextRelease(ctx);
                      CGColorSpaceRelease(colorSpace);
                      captured = true;
                  };
                  if ([NSThread isMainThread]) captureBlock();
                  else dispatch_sync(dispatch_get_main_queue(), captureBlock);
                  outHeight = bufH;
                  return captured && !outPixels.empty() && bufH > 0;
              }

              PieceShape recognizeDockSlot(const std::vector<RGBAPixel>& buffer, int bufW, int bufH, int slotIndex,
                                           float slotNormX, float slotNormY, float slotNormW, float slotNormH, float expectedDockCellPx) {
                  PieceShape shape;
                  shape.slotIndex = slotIndex;
                  int x0 = std::max(0, static_cast<int>(std::round(slotNormX * bufW)));
                  int y0 = std::max(0, static_cast<int>(std::round(slotNormY * bufH)));
                  int x1 = std::min(bufW - 1, static_cast<int>(std::round((slotNormX + slotNormW) * bufW)));
                  int y1 = std::min(bufH - 1, static_cast<int>(std::round((slotNormY + slotNormH) * bufH)));
                  if (x1 <= x0 + 6 || y1 <= y0 + 6) return shape;

                  float sumBgR = 0, sumBgG = 0, sumBgB = 0; int bgSamples = 0;
                  for (int x = x0 + 3; x <= x1 - 3; x += 4) {
                      const RGBAPixel& pTop = buffer[(y0 + 3) * bufW + x];
                      const RGBAPixel& pBot = buffer[(y1 - 3) * bufW + x];
                      sumBgR += pTop.r + pBot.r; sumBgG += pTop.g + pBot.g; sumBgB += pTop.b + pBot.b;
                      bgSamples += 2;
                  }
                  float bgR = bgSamples ? sumBgR / bgSamples : 43.0f, bgG = bgSamples ? sumBgG / bgSamples : 62.0f, bgB = bgSamples ? sumBgB / bgSamples : 129.0f;
                  constexpr float DOCK_FG_DIST_THRESHOLD = 26.0f;
                  int minFgX = x1, maxFgX = x0, minFgY = y1, maxFgY = y0, fgCount = 0;
                  for (int y = y0 + 4; y <= y1 - 4; ++y)
                      for (int x = x0 + 4; x <= x1 - 4; ++x)
                          if (computeColorDistance(buffer[y * bufW + x], bgR, bgG, bgB) > DOCK_FG_DIST_THRESHOLD) {
                              minFgX = std::min(minFgX, x); maxFgX = std::max(maxFgX, x);
                              minFgY = std::min(minFgY, y); maxFgY = std::max(maxFgY, y);
                              fgCount++;
                          }

                  float fgBoxW = static_cast<float>(maxFgX - minFgX + 1), fgBoxH = static_cast<float>(maxFgY - minFgY + 1);
                  if (fgCount < 18 || fgBoxW < expectedDockCellPx * 0.50f || fgBoxH < expectedDockCellPx * 0.50f) return shape;

                  shape.cols = std::clamp(static_cast<int>(std::round(fgBoxW / expectedDockCellPx)), 1, 5);
                  shape.rows = std::clamp(static_cast<int>(std::round(fgBoxH / expectedDockCellPx)), 1, 5);
                  float cellStepW = fgBoxW / shape.cols, cellStepH = fgBoxH / shape.rows;

                  for (int r = 0; r < shape.rows; ++r) {
                      for (int c = 0; c < shape.cols; ++c) {
                          int cx = static_cast<int>(std::round(minFgX + (c + 0.5f) * cellStepW));
                          int cy = static_cast<int>(std::round(minFgY + (r + 0.5f) * cellStepH));
                          int activeSamples = 0, totalSamples = 0, radius = std::max(2, static_cast<int>(std::min(cellStepW, cellStepH) * 0.28f));
                          for (int dy = -radius; dy <= radius; ++dy)
                              for (int dx = -radius; dx <= radius; ++dx) {
                                  totalSamples++;
                                  if (computeColorDistance(buffer[std::clamp(cy + dy, y0, y1) * bufW + std::clamp(cx + dx, x0, x1)], bgR, bgG, bgB) > DOCK_FG_DIST_THRESHOLD)
                                      activeSamples++;
                              }
                          if (activeSamples * 10 >= totalSamples * 3) { shape.setCell(r, c, true); shape.cellCount++; }
                      }
                  }
                  shape.valid = (shape.cellCount > 0);
                  shape.centerNormX = ((minFgX + maxFgX) * 0.5f) / bufW;
                  shape.centerNormY = ((minFgY + maxFgY) * 0.5f) / bufH;
                  return shape;
              }

              VisionSnapshotResult analyzeCurrentScreen(UIWindow* gameWindow, UIWindow* overlayWindowToIgnore, const CalibrationConfig& config) {
                  VisionSnapshotResult result;
                  int bufW = 360, bufH = 0;
                  std::vector<RGBAPixel> pixels;
                  if (!captureWindowPixels(gameWindow, overlayWindowToIgnore, bufW, bufH, pixels)) return result;

                  float boardPxX = config.boardX * bufW, boardPxY = config.boardY * bufH, boardPxW = config.boardW * bufW;
                  float cellW = boardPxW / 8.0f, cellH = boardPxW / 8.0f;
                  struct CellSample { float r, g, b, luminance; };
                  std::array<CellSample, 64> samples;
                  float minLum = 1000.0f, bgRefR = 26.0f, bgRefG = 35.0f, bgRefB = 74.0f;

                  for (int r = 0; r < 8; ++r) {
                      for (int c = 0; c < 8; ++c) {
                          int cx = static_cast<int>(std::round(boardPxX + (c + 0.5f) * cellW));
                          int cy = static_cast<int>(std::round(boardPxY + (r + 0.5f) * cellH));
                          float sumR = 0, sumG = 0, sumB = 0; int cnt = 0;
                          for (int dy = -2; dy <= 2; ++dy)
                              for (int dx = -2; dx <= 2; ++dx) {
                                  const RGBAPixel& p = pixels[std::clamp(cy + dy, 0, bufH - 1) * bufW + std::clamp(cx + dx, 0, bufW - 1)];
                                  sumR += p.r; sumG += p.g; sumB += p.b; cnt++;
                              }
                          float avgR = sumR / cnt, avgG = sumG / cnt, avgB = sumB / cnt;
                          float lum = 0.299f * avgR + 0.587f * avgG + 0.114f * avgB;
                          samples[r * 8 + c] = {avgR, avgG, avgB, lum};
                          if (lum < minLum && lum < 52.0f) { minLum = lum; bgRefR = avgR; bgRefG = avgG; bgRefB = avgB; }
                      }
                  }
                  if (minLum > 52.0f) minLum = 37.0f;

                  uint64_t boardBits = 0ULL;
                  for (int i = 0; i < 64; ++i) {
                      float dr = samples[i].r - bgRefR, dg = samples[i].g - bgRefG, db = samples[i].b - bgRefB;
                      if (std::sqrt(dr * dr + dg * dg + db * db) > 42.0f || (samples[i].luminance - minLum) > 26.0f)
                          boardBits |= (1ULL << i);
                  }

                  float expectedDockCellPx = cellW * config.dockCellScale, slotW = config.dockW / 3.0f;
                  result.dockPieces.resize(3);
                  for (int s = 0; s < 3; ++s)
                      result.dockPieces[s] = recognizeDockSlot(pixels, bufW, bufH, s, config.dockX + s * slotW, config.dockY, slotW, config.dockH, expectedDockCellPx);

                  result.boardBits = boardBits;
                  result.success = true;
                  return result;
              }
          };

          } // namespace BBAuto

          @interface UITouch (PrivateSynthesize)
          - (void)setPhase:(UITouchPhase)phase;
          - (void)setTapCount:(NSUInteger)tapCount;
          - (void)setWindow:(UIWindow *)window;
          - (void)setView:(UIView *)view;
          - (void)_setLocationInWindow:(CGPoint)location resetPrevious:(BOOL)reset;
          - (void)_setIsFirstTouchForView:(BOOL)first;
          - (void)setTimestamp:(NSTimeInterval)timestamp;
          @end

          @interface UIEvent (PrivateSynthesize)
          - (void)_addTouch:(UITouch *)touch forDelayedDelivery:(BOOL)delayed;
          - (void)_clearTouches;
          @end

          namespace BBAuto {

          class TouchSynthesizer {
          public:
              void executeDragMove(UIWindow* targetWindow, const PlacementMove& move, const CalibrationConfig& config, dispatch_block_t completion) {
                  if (!targetWindow) { if (completion) completion(); return; }
                  CGSize winSize = targetWindow.bounds.size;
                  CGFloat startX = move.piece.centerNormX * winSize.width, startY = move.piece.centerNormY * winSize.height;
                  CGFloat boardX = config.boardX * winSize.width, boardY = config.boardY * winSize.height;
                  CGFloat cellW = (config.boardW * winSize.width) / 8.0;
                  CGFloat targetPieceCenterX = boardX + (move.targetCol + move.piece.cols * 0.5) * cellW;
                  CGFloat targetPieceCenterY = boardY + (move.targetRow + move.piece.rows * 0.5) * cellW;
                  CGFloat gainX = std::max(0.8f, config.dragGainX), gainY = std::max(0.8f, config.dragGainY);
                  CGFloat endX = std::clamp<double>(startX + (targetPieceCenterX - startX) / gainX, 28.0, winSize.width - 28.0);
                  CGFloat endY = std::clamp<double>(startY + ((targetPieceCenterY + config.dragLiftOffsetY) - startY) / gainY, 70.0, winSize.height - 50.0);

                  CGPoint startPt = CGPointMake(startX, startY), endPt = CGPointMake(endX, endY);
                  int totalSteps = std::clamp(static_cast<int>(std::round(28.0 / std::clamp(config.dragSpeedMultiplier, 0.3f, 2.0f))), 14, 65);
                  double stepIntervalSec = 0.014;

                  dispatch_async(dispatch_get_main_queue(), ^{
                      dispatchSingleTouchPhase(targetWindow, startPt, UITouchPhaseBegan);
                      for (int step = 1; step <= totalSteps; ++step) {
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, static_cast<int64_t>(step * stepIntervalSec * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                              double easedT = 1.0 - std::pow(1.0 - (static_cast<double>(step) / totalSteps), 2.5);
                              dispatchSingleTouchPhase(targetWindow, CGPointMake(startPt.x + (endPt.x - startPt.x) * easedT, startPt.y + (endPt.y - startPt.y) * easedT), UITouchPhaseMoved);
                          });
                      }
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, static_cast<int64_t>(((totalSteps * stepIntervalSec) + 0.12) * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          dispatchSingleTouchPhase(targetWindow, endPt, UITouchPhaseEnded);
                          if (completion) completion();
                      });
                  });
              }

          private:
              void dispatchSingleTouchPhase(UIWindow* window, CGPoint pointInWindow, UITouchPhase phase) {
                  if (!window) return;
                  static UITouch* activeTouch = nil;
                  static UIView* targetHitView = nil;
                  if (phase == UITouchPhaseBegan || activeTouch == nil) {
                      activeTouch = [[UITouch alloc] init];
                      targetHitView = [window hitTest:pointInWindow withEvent:nil] ?: window.rootViewController.view ?: window;
                      if ([activeTouch respondsToSelector:@selector(setWindow:)]) [activeTouch setWindow:window];
                      if ([activeTouch respondsToSelector:@selector(setView:)]) [activeTouch setView:targetHitView];
                      if ([activeTouch respondsToSelector:@selector(setTapCount:)]) [activeTouch setTapCount:1];
                      if ([activeTouch respondsToSelector:@selector(_setIsFirstTouchForView:)]) [activeTouch _setIsFirstTouchForView:YES];
                      if ([activeTouch respondsToSelector:@selector(_setLocationInWindow:resetPrevious:)]) [activeTouch _setLocationInWindow:pointInWindow resetPrevious:YES];
                  } else if ([activeTouch respondsToSelector:@selector(_setLocationInWindow:resetPrevious:)]) {
                      [activeTouch _setLocationInWindow:pointInWindow resetPrevious:NO];
                  }
                  if ([activeTouch respondsToSelector:@selector(setPhase:)]) [activeTouch setPhase:phase];
                  if ([activeTouch respondsToSelector:@selector(setTimestamp:)]) [activeTouch setTimestamp:[[NSProcessInfo processInfo] systemUptime]];

                  UIEvent* touchesEvent = nil;
                  if ([[UIApplication sharedApplication] respondsToSelector:NSSelectorFromString(@"_touchesEvent")])
                      touchesEvent = [[UIApplication sharedApplication] valueForKey:@"_touchesEvent"];
                  if (touchesEvent && [touchesEvent respondsToSelector:@selector(_addTouch:forDelayedDelivery:)]) {
                      if ([touchesEvent respondsToSelector:@selector(_clearTouches)]) [touchesEvent _clearTouches];
                      [touchesEvent _addTouch:activeTouch forDelayedDelivery:NO];
                  }
                  NSSet<UITouch*>* touchSet = [NSSet setWithObject:activeTouch];
                  if (targetHitView) {
                      if (phase == UITouchPhaseBegan) [targetHitView touchesBegan:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseMoved) [targetHitView touchesMoved:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseEnded) [targetHitView touchesEnded:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseCancelled) [targetHitView touchesCancelled:touchSet withEvent:touchesEvent];
                  }
                  if (phase == UITouchPhaseEnded || phase == UITouchPhaseCancelled) {
                      if (touchesEvent && [touchesEvent respondsToSelector:@selector(_clearTouches)]) [touchesEvent _clearTouches];
                      activeTouch = nil; targetHitView = nil;
                  }
              }
          };

          } // namespace BBAuto


                                            action:@selector(handleStart)];
              _pauseBtn = [self createActionButton:@"PAUSE" frame:CGRectMake(94, 26, 80, 26)
                                           bgColor:[UIColor colorWithRed:0.85f green:0.55f blue:0.12f alpha:1.0f]
                                            action:@selector(handlePause)];
              _stopBtn  = [self createActionButton:@"STOP"  frame:CGRectMake(180, 26, 80, 26)
                                           bgColor:[UIColor colorWithRed:0.78f green:0.22f blue:0.22f alpha:1.0f]
                                            action:@selector(handleStop)];
              [_panelView addSubview:_startBtn];
              [_panelView addSubview:_pauseBtn];
              [_panelView addSubview:_stopBtn];

              _strategySegment = [[UISegmentedControl alloc] initWithItems:@[@"COMBO", @"SURVIVAL", @"AUTO"]];
              _strategySegment.frame = CGRectMake(8, 56, 252, 24);
              _strategySegment.selectedSegmentIndex = 2;
              [_strategySegment addTarget:self action:@selector(handleStrategySegment:) forControlEvents:UIControlEventValueChanged];
              [_panelView addSubview:_strategySegment];

              _statsLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 86, 248, 32)];
              _statsLabel.numberOfLines = 2;
              _statsLabel.font = [UIFont monospacedDigitSystemFontOfSize:10.0 weight:UIFontWeightMedium];
              _statsLabel.textColor = [UIColor whiteColor];
              _statsLabel.text = @"Luot: 0 | Xoa: 0 | Combo: 0\nPhuong an: 0 | Che do: AUTO";
              [_panelView addSubview:_statsLabel];

              _statusLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 120, 248, 18)];
              _statusLabel.font = [UIFont systemFontOfSize:10.0];
              _statusLabel.textColor = [UIColor colorWithRed:0.6f green:0.95f blue:0.65f alpha:1.0f];
              _statusLabel.text = @"Trang thai: San sang";
              [_panelView addSubview:_statusLabel];
          }

          - (UIButton *)createActionButton:(NSString *)title frame:(CGRect)frame bgColor:(UIColor *)bgColor action:(SEL)sel {
              UIButton* btn = [UIButton buttonWithType:UIButtonTypeSystem];
              btn.frame = frame;
              btn.backgroundColor = bgColor;
              btn.layer.cornerRadius = 6.0;
              [btn setTitle:title forState:UIControlStateNormal];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:11.0];
              [btn addTarget:self action:sel forControlEvents:UIControlEventTouchUpInside];
              return btn;
          }

          - (void)handlePanelPan:(UIPanGestureRecognizer *)pan {
              CGPoint trans = [pan translationInView:self.rootViewController.view];
              CGPoint center = _panelView.center;
              center.x += trans.x;
              center.y += trans.y;
              _panelView.center = center;
              [pan setTranslation:CGPointZero inView:self.rootViewController.view];
          }

          - (void)toggleMinimize {
              _isMinimized = !_isMinimized;
              CGRect f = _panelView.frame;
              f.size.height = _isMinimized ? 26.0 : 162.0;
              _configSubPanel.hidden = YES;
              _showAdvancedConfig = NO;
              [UIView animateWithDuration:0.18 animations:^{
                  self->_panelView.frame = f;
                  self->_titleLabel.text = self->_isMinimized ? @"BLOCK BLAST AI [+]" : @"BLOCK BLAST AI";
              }];
          }

          - (void)toggleConfigPanel {
              _showAdvancedConfig = !_showAdvancedConfig;
              _configSubPanel.hidden = !_showAdvancedConfig;
              CGRect f = _panelView.frame;
              f.size.height = _showAdvancedConfig ? 228.0 : 162.0;
              [UIView animateWithDuration:0.18 animations:^{
                  self->_panelView.frame = f;
              }];
          }

          - (void)handleStart { [self.controlDelegate onOverlayStartClicked]; }
          - (void)handlePause { [self.controlDelegate onOverlayPauseResumeClicked]; }
          - (void)handleStop { [self.controlDelegate onOverlayStopClicked]; }

          - (void)handleStrategySegment:(UISegmentedControl *)seg {
              BBAuto::PlayStrategy st = static_cast<BBAuto::PlayStrategy>(seg.selectedSegmentIndex);
              [self.controlDelegate onOverlayStrategyChanged:st];
          }

          - (void)handleLiftChanged:(UISlider *)slider {
              float val = std::round(slider.value);
              _liftLabel.text = [NSString stringWithFormat:@"Độ nâng: %.0f", val];
              [self.controlDelegate onOverlayLiftOffsetChanged:val];
          }

          - (void)handleSpeedChanged:(UISlider *)slider {
              float val = slider.value;
              _speedLabel.text = [NSString stringWithFormat:@"Tốc độ: %.1fx", val];
              [self.controlDelegate onOverlaySpeedChanged:val];
          }

          - (void)handleBoardYChanged:(UISlider *)slider {
              float val = slider.value;
              _boardYLabel.text = [NSString stringWithFormat:@"Bàn Y: %.3f", val];
              [self.controlDelegate onOverlayBoardYChanged:val];
          }

          - (void)handleDockYChanged:(UISlider *)slider {
              float val = slider.value;
              _dockYLabel.text = [NSString stringWithFormat:@"Dock Y: %.3f", val];
              [self.controlDelegate onOverlayDockYChanged:val];
          }

          - (void)handleCalibToggle {
              BOOL nextState = !_guideView.currentConfig.showCalibrationOverlay;
              [self.controlDelegate onOverlayToggleCalibrationFrame:nextState];
          }

          - (void)updateTelemetry:(const BBAuto::RuntimeTelemetry&)telemetry
                         runState:(BBAuto::EngineRunState)runState
                      calibration:(const BBAuto::CalibrationConfig&)config {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self->_guideView.currentConfig = config;
                  self->_guideView.detectedBoardBits = telemetry.lastDetectedBoard;
                  self->_guideView.detectedDock = telemetry.lastDetectedDock;
                  [self->_guideView setNeedsDisplay];

                  NSString* stratStr = (telemetry.effectiveStrategy == BBAuto::PlayStrategy::MAX_SURVIVAL)
                      ? @"MAX_SURVIVAL" : @"AUTO_COMBO";

                  [self->_pauseBtn setTitle:(runState == BBAuto::EngineRunState::PAUSED ? @"RESUME" : @"PAUSE")
                                   forState:UIControlStateNormal];

                  self->_statsLabel.text = [NSString stringWithFormat:
                      @"Luot: %d | Hang xoa: %d | Combo: %d\nPhuong an: %d | Chien thuat: %@",
                      telemetry.turnsExecuted,
                      telemetry.totalLinesCleared,
                      telemetry.currentCombo,
                      telemetry.lastValidSequences,
                      stratStr
                  ];
                  self->_statusLabel.text = [NSString stringWithFormat:@"Trang thai: %s", telemetry.statusMessage.c_str()];
              });
          }
          @end

          @interface BBAutoPlayController : NSObject <BBAutoOverlayDelegate>
          + (instancetype)sharedInstance;
          - (void)attachToApplicationWindow;
          @end

          @implementation BBAutoPlayController {
              BBAutoOverlayWindow* _overlayWindow;
              dispatch_queue_t _workerQueue;
              BBAuto::BlockSolver _solver;
              BBAuto::VisionAnalyzer _vision;
              BBAuto::TouchSynthesizer _touch;
              BBAuto::CalibrationConfig _calibration;
              BBAuto::RuntimeTelemetry _telemetry;
              std::atomic<BBAuto::EngineRunState> _runState;
              std::atomic<bool> _loopActive;
          }

          + (instancetype)sharedInstance {
              static BBAutoPlayController* instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  instance = [[BBAutoPlayController alloc] init];
              });
              return instance;
          }

          - (instancetype)init {
              if (self = [super init]) {
                  _workerQueue = dispatch_queue_create("com.autoplay.blockblast.worker", DISPATCH_QUEUE_SERIAL);
                  _runState.store(BBAuto::EngineRunState::STOPPED);
                  _loopActive.store(false);
              }
              return self;
          }

          - (UIWindow *)findActiveGameWindow {
              __block UIWindow* foundWindow = nil;
              auto finder = ^{
                  NSArray<UIWindow *>* windows = [[UIApplication sharedApplication] windows];
                  for (UIWindow* win in windows) {
                      if (win == self->_overlayWindow) continue;
                      if (!win.hidden && win.alpha > 0.01 && CGRectGetWidth(win.bounds) > 200) {
                          foundWindow = win;
                          break;
                      }
                  }
              };
              if ([NSThread isMainThread]) finder();
              else dispatch_sync(dispatch_get_main_queue(), finder);
              return foundWindow;
          }

          - (void)attachToApplicationWindow {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self->_overlayWindow) return;
                  CGRect screenBounds = [UIScreen mainScreen].bounds;
                  self->_overlayWindow = [[BBAutoOverlayWindow alloc] initWithFrame:screenBounds];
                  self->_overlayWindow.controlDelegate = self;
                  self->_overlayWindow.hidden = NO;
                  [self refreshUI];
              });
          }

          - (void)refreshUI {
              if (_overlayWindow) {
                  [_overlayWindow updateTelemetry:_telemetry
                                         runState:_runState.load()
                                      calibration:_calibration];
              }
          }

          - (void)onOverlayStartClicked {
              if (_runState.load() == BBAuto::EngineRunState::RUNNING) return;
              _runState.store(BBAuto::EngineRunState::RUNNING);
              _telemetry.statusMessage = "Dang phan tich ban choi...";
              [self refreshUI];
              if (!_loopActive.exchange(true)) {
                  [self scheduleNextCycleWithDelay:0.15];
              }
          }

          - (void)onOverlayStopClicked {
              _runState.store(BBAuto::EngineRunState::STOPPED);
              _loopActive.store(false);
              _telemetry.statusMessage = "Da dung";
              [self refreshUI];
          }

          - (void)onOverlayPauseResumeClicked {
              BBAuto::EngineRunState cur = _runState.load();
              if (cur == BBAuto::EngineRunState::RUNNING) {
                  _runState.store(BBAuto::EngineRunState::PAUSED);
                  _telemetry.statusMessage = "Dang tam dung";
                  [self refreshUI];
              } else if (cur == BBAuto::EngineRunState::PAUSED) {
                  _runState.store(BBAuto::EngineRunState::RUNNING);
                  _telemetry.statusMessage = "Tiep tuc chay...";
                  [self refreshUI];
                  if (!_loopActive.exchange(true)) {
                      [self scheduleNextCycleWithDelay:0.15];
                  }
              }
          }

          - (void)onOverlayStrategyChanged:(BBAuto::PlayStrategy)newStrategy {
              _telemetry.requestedStrategy = newStrategy;
              [self refreshUI];
          }

          - (void)onOverlayLiftOffsetChanged:(float)newLiftOffset {
              _calibration.dragLiftOffsetY = newLiftOffset;
          }

          - (void)onOverlaySpeedChanged:(float)newSpeed {
              _calibration.dragSpeedMultiplier = newSpeed;
          }

          - (void)onOverlayBoardYChanged:(float)newBoardY {
              _calibration.boardY = newBoardY;
              [self triggerLiveDetection];
          }

          - (void)onOverlayDockYChanged:(float)newDockY {
              _calibration.dockY = newDockY;
              [self triggerLiveDetection];
          }

          - (void)onOverlayToggleCalibrationFrame:(BOOL)visible {
              _calibration.showCalibrationOverlay = visible;
              [self triggerLiveDetection];
          }

          - (void)triggerLiveDetection {
              dispatch_async(_workerQueue, ^{
                  UIWindow* gameWin = [self findActiveGameWindow];
                  if (gameWin) {
                      BBAuto::VisionSnapshotResult snap = self->_vision.analyzeCurrentScreen(gameWin, self->_overlayWindow, self->_calibration);
                      if (snap.success) {
                          self->_telemetry.lastDetectedBoard = snap.boardBits;
                          for (int i = 0; i < 3 && i < (int)snap.dockPieces.size(); ++i) {
                              self->_telemetry.lastDetectedDock[i] = snap.dockPieces[i];
                          }
                      }
                  }
                  [self refreshUI];
              });
          }

          - (void)scheduleNextCycleWithDelay:(double)delaySeconds {
              dispatch_after(
                  dispatch_time(DISPATCH_TIME_NOW, static_cast<int64_t>(delaySeconds * NSEC_PER_SEC)),
                  _workerQueue,
                  ^{ [self executeSolverCycle]; }
              );
          }

          - (void)executeSolverCycle {
              if (_runState.load() != BBAuto::EngineRunState::RUNNING) {
                  _loopActive.store(false);
                  return;
              }

              UIWindow* gameWindow = [self findActiveGameWindow];
              if (!gameWindow) {
                  _telemetry.statusMessage = "Dang cho cua so game...";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.5];
                  return;
              }

              BBAuto::VisionSnapshotResult snap = _vision.analyzeCurrentScreen(gameWindow, _overlayWindow, _calibration);
              if (!snap.success) {
                  _telemetry.statusMessage = "Loi chup man hinh";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.4];
                  return;
              }

              _telemetry.lastDetectedBoard = snap.boardBits;
              int validPiecesCount = 0;
              for (int i = 0; i < 3 && i < (int)snap.dockPieces.size(); ++i) {
                  _telemetry.lastDetectedDock[i] = snap.dockPieces[i];
                  if (snap.dockPieces[i].valid) validPiecesCount++;
              }

              if (validPiecesCount == 0) {
                  _telemetry.statusMessage = "Cho game phat 3 khoi moi...";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.25];
                  return;
              }

              BBAuto::TurnPlan plan = _solver.solveTurn(
                  snap.boardBits,
                  snap.dockPieces,
                  _telemetry.currentCombo,
                  _telemetry.movesSinceLastClear,
                  _telemetry.requestedStrategy
              );

              _telemetry.effectiveStrategy = plan.activeStrategy;
              _telemetry.lastValidSequences = plan.validSequencesFound;

              if (!plan.feasible || plan.moves.empty()) {
                  int occ = BBAuto::popcount64(snap.boardBits);
                  _telemetry.statusMessage = "Het nuoc (O day: " + std::to_string(occ) + "/64)";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.6];
                  return;
              }

              const BBAuto::PlacementMove firstMove = plan.moves.front();
              int prevSlot = firstMove.slotIndex;

              _telemetry.statusMessage = "Keo khay " + std::to_string(prevSlot + 1) +
                                         " -> (" + std::to_string(firstMove.targetRow + 1) +
                                         "," + std::to_string(firstMove.targetCol + 1) + ")";
              [self refreshUI];

              dispatch_semaphore_t dragDoneSem = dispatch_semaphore_create(0);
              _touch.executeDragMove(gameWindow, firstMove, _calibration, ^{
                  dispatch_semaphore_signal(dragDoneSem);
              });
              dispatch_semaphore_wait(dragDoneSem, dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));

              double waitAnimSec = (firstMove.linesCleared > 0) ? 0.38 : 0.22;
              [NSThread sleepForTimeInterval:waitAnimSec];

              if (_runState.load() != BBAuto::EngineRunState::RUNNING) {
                  _loopActive.store(false);
                  return;
              }

              BBAuto::VisionSnapshotResult postSnap = _vision.analyzeCurrentScreen(gameWindow, _overlayWindow, _calibration);
              bool slotConsumed = (prevSlot >= 0 && prevSlot < 3 && !postSnap.dockPieces[prevSlot].valid);
              bool boardChanged = (postSnap.boardBits != snap.boardBits);

              if (slotConsumed || boardChanged) {
                  _telemetry.movesExecuted++;
                  if (_telemetry.movesExecuted % 3 == 0) _telemetry.turnsExecuted++;

                  if (firstMove.linesCleared > 0) {
                      _telemetry.totalLinesCleared += firstMove.linesCleared;
                      _telemetry.currentCombo += 1;
                      _telemetry.movesSinceLastClear = 0;
                  } else {
                      _telemetry.movesSinceLastClear += 1;
                      if (_telemetry.movesSinceLastClear >= 3) _telemetry.currentCombo = 0;
                  }
                  _telemetry.statusMessage = "Dat thanh cong!";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.08];
              } else {
                  _telemetry.statusMessage = "Chua khop, chinh lai Board Y/Dock Y";
                  [self refreshUI];
                  [self scheduleNextCycleWithDelay:0.25];
              }
          }
          @end

          __attribute__((constructor))
          static void initializeBlockBlastAutoDylib() {
              @autoreleasepool {
                  [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidBecomeActiveNotification
                                                                    object:nil
                                                                     queue:[NSOperationQueue mainQueue]
                                                                usingBlock:^(NSNotification * _Nonnull note) {
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          [[BBAutoPlayController sharedInstance] attachToApplicationWindow];
                      });
                  }];
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -dynamiclib \
            -std=c++17 \
            -fobjc-arc \
            -O3 \
            -mios-version-min=14.0 \
            -isysroot "$SDK_PATH" \
            -Wl,-install_name,@rpath/BlockBlastAuto.dylib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            BlockBlastAuto.mm \
            -o BlockBlastAuto.dylib

          ldid -S BlockBlastAuto.dylib
          rm -f BlockBlastAuto.mm

      - name: Commit BlockBlastAuto.dylib directly to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f BlockBlastAuto.dylib
          git diff --staged --quiet || (git commit -m "Build fully calibratable dylib [skip ci]" && git push)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-dylib
          path: BlockBlastAuto.dylib

          namespace BBAuto {

          // 3. TOUCH SYNTHESIZER: BIEN KEO 1.65 -> TIM DUONG TRONG 3 GIAY -> KHOP HINH MO PHONG -> THA RA
          class TouchSynthesizer {
          public:
              CGPoint computeFingerHoldPoint(UIWindow* targetWindow, const PlacementMove& move, const CalibrationConfig& config, float extraOffsetRow, float extraOffsetCol) {
                  CGSize winSize = targetWindow.bounds.size;
                  CGFloat startX = move.piece.centerNormX * winSize.width, startY = move.piece.centerNormY * winSize.height;
                  CGFloat outerX = config.boardX * winSize.width, outerY = config.boardY * winSize.height, outerW = config.boardW * winSize.width;
                  CGFloat borderPad = outerW * config.gridBorderRatio;
                  CGFloat gridX = outerX + borderPad, gridY = outerY + borderPad, cellW = (outerW - 2.0 * borderPad) / 8.0;

                  CGFloat targetColCenter = move.targetCol + move.piece.cols * 0.5 + config.learnedBiasCol + extraOffsetCol;
                  CGFloat targetRowCenter = move.targetRow + move.piece.rows * 0.5 + config.learnedBiasRow + extraOffsetRow;

                  CGFloat targetPieceCenterX = gridX + targetColCenter * cellW;
                  CGFloat targetPieceCenterY = gridY + targetRowCenter * cellW;

                  CGFloat gainX = std::max(0.75f, config.dragGainX), gainY = std::max(0.75f, config.dragGainY);
                  CGFloat rawEndX = startX + (targetPieceCenterX - startX) / gainX;
                  CGFloat rawEndY = startY + ((targetPieceCenterY + config.dragLiftOffsetY) - startY) / gainY;

                  return CGPointMake(std::clamp<double>(rawEndX, 14.0, winSize.width - 14.0),
                                     std::clamp<double>(rawEndY, 45.0, winSize.height - 25.0));
              }

              void beginAndDragToHoldPoint(UIWindow* targetWindow, CGPoint startPt, CGPoint holdPt, float speedMult) {
                  if (!targetWindow) return;
                  int steps = std::clamp(static_cast<int>(std::round(24.0 / std::clamp(speedMult, 0.3f, 2.0f))), 15, 48);
                  dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, startPt, UITouchPhaseBegan); });
                  [NSThread sleepForTimeInterval:0.015];
                  dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, CGPointMake(startPt.x, startPt.y - 2.0), UITouchPhaseMoved); });
                  [NSThread sleepForTimeInterval:0.015];
                  dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, CGPointMake(startPt.x, startPt.y - 4.0), UITouchPhaseMoved); });

                  for (int s = 1; s <= steps; ++s) {
                      [NSThread sleepForTimeInterval:0.012];
                      double smoothT = 0.5 - 0.5 * std::cos((static_cast<double>(s) / steps) * M_PI);
                      CGPoint curPt = CGPointMake(startPt.x + (holdPt.x - startPt.x) * smoothT, startPt.y + (holdPt.y - startPt.y) * smoothT);
                      dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, curPt, UITouchPhaseMoved); });
                  }
              }

              void moveHeldFingerSmoothly(UIWindow* targetWindow, CGPoint fromPt, CGPoint toPt, int subSteps) {
                  if (!targetWindow) return;
                  for (int s = 1; s <= subSteps; ++s) {
                      [NSThread sleepForTimeInterval:0.015];
                      double t = static_cast<double>(s) / subSteps;
                      CGPoint curPt = CGPointMake(fromPt.x + (toPt.x - fromPt.x) * t, fromPt.y + (toPt.y - fromPt.y) * t);
                      dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, curPt, UITouchPhaseMoved); });
                  }
              }

              void sendHoldHeartbeat(UIWindow* targetWindow, CGPoint holdPt) {
                  if (!targetWindow) return;
                  dispatch_sync(dispatch_get_main_queue(), ^{ dispatchSingleTouchPhase(targetWindow, holdPt, UITouchPhaseMoved); });
              }

              void commitDropAtPoint(UIWindow* targetWindow, CGPoint dropPt) {
                  if (!targetWindow) return;
                  dispatch_sync(dispatch_get_main_queue(), ^{
                      dispatchSingleTouchPhase(targetWindow, dropPt, UITouchPhaseMoved);
                      dispatchSingleTouchPhase(targetWindow, dropPt, UITouchPhaseEnded);
                  });
              }

          private:
              void dispatchSingleTouchPhase(UIWindow* window, CGPoint pointInWindow, UITouchPhase phase) {
                  if (!window) return;
                  static UITouch* activeTouch = nil;
                  static UIView* targetHitView = nil;
                  if (phase == UITouchPhaseBegan || activeTouch == nil) {
                      activeTouch = [[UITouch alloc] init];
                      targetHitView = [window hitTest:pointInWindow withEvent:nil] ?: window.rootViewController.view ?: window;
                      if ([activeTouch respondsToSelector:@selector(setWindow:)]) [activeTouch setWindow:window];
                      if ([activeTouch respondsToSelector:@selector(setView:)]) [activeTouch setView:targetHitView];
                      if ([activeTouch respondsToSelector:@selector(setTapCount:)]) [activeTouch setTapCount:1];
                      if ([activeTouch respondsToSelector:@selector(_setIsFirstTouchForView:)]) [activeTouch _setIsFirstTouchForView:YES];
                      if ([activeTouch respondsToSelector:@selector(_setLocationInWindow:resetPrevious:)]) [activeTouch _setLocationInWindow:pointInWindow resetPrevious:YES];
                  } else if ([activeTouch respondsToSelector:@selector(_setLocationInWindow:resetPrevious:)]) {
                      [activeTouch _setLocationInWindow:pointInWindow resetPrevious:NO];
                  }
                  if ([activeTouch respondsToSelector:@selector(setPhase:)]) [activeTouch setPhase:phase];
                  if ([activeTouch respondsToSelector:@selector(setTimestamp:)]) [activeTouch setTimestamp:[[NSProcessInfo processInfo] systemUptime]];

                  UIEvent* touchesEvent = nil;
                  if ([[UIApplication sharedApplication] respondsToSelector:NSSelectorFromString(@"_touchesEvent")])
                      touchesEvent = [[UIApplication sharedApplication] valueForKey:@"_touchesEvent"];
                  if (touchesEvent && [touchesEvent respondsToSelector:@selector(_addTouch:forDelayedDelivery:)]) {
                      if ([touchesEvent respondsToSelector:@selector(_clearTouches)]) [touchesEvent _clearTouches];
                      [touchesEvent _addTouch:activeTouch forDelayedDelivery:NO];
                  }
                  NSSet<UITouch*>* touchSet = [NSSet setWithObject:activeTouch];
                  if (targetHitView) {
                      if (phase == UITouchPhaseBegan) [targetHitView touchesBegan:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseMoved) [targetHitView touchesMoved:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseEnded) [targetHitView touchesEnded:touchSet withEvent:touchesEvent];
                      else if (phase == UITouchPhaseCancelled) [targetHitView touchesCancelled:touchSet withEvent:touchesEvent];
                  }
                  if (phase == UITouchPhaseEnded || phase == UITouchPhaseCancelled) {
                      if (touchesEvent && [touchesEvent respondsToSelector:@selector(_clearTouches)]) [touchesEvent _clearTouches];
                      activeTouch = nil; targetHitView = nil;
                  }
              }
          };


                  [self->_guideView setNeedsDisplay];
                  NSString* stratStr = (telemetry.effectiveStrategy == BBAuto::PlayStrategy::MAX_SURVIVAL) ? @"SURVIVAL" : @"COMBO+SURV";
                  self->_statsLabel.text = [NSString stringWithFormat:@"Luot: %d | Xoa: %d | Combo: %d\nPA: %d | Uu tien: %@",
                      telemetry.turnsExecuted, telemetry.totalLinesCleared, telemetry.currentCombo, telemetry.lastValidSequences, stratStr];
                  self->_statusLabel.text = [NSString stringWithFormat:@"TT: %s", telemetry.statusMessage.c_str()];
              });
          }
          @end

          @interface BBAutoPlayController : NSObject <BBAutoOverlayDelegate>
          + (instancetype)sharedInstance;
          - (void)attachToApplicationWindow;
          @end

          @implementation BBAutoPlayController {
              BBAutoOverlayWindow* _overlayWindow;
              dispatch_queue_t _workerQueue;
              BBAuto::BlockSolver _solver;
              BBAuto::VisionAnalyzer _vision;
              BBAuto::TouchSynthesizer _touch;
              BBAuto::CalibrationConfig _calibration;
              BBAuto::RuntimeTelemetry _telemetry;
              std::atomic<BBAuto::EngineRunState> _runState;
              std::atomic<bool> _loopActive;
              BBAuto::TurnPlan _lockedGuidePlan;
              int _lockedGuideStepIdx, _placementConfirmCounter;
              uint64_t _boardBeforeGuideStep;
          }

          + (instancetype)sharedInstance {
              static BBAutoPlayController* instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ instance = [[BBAutoPlayController alloc] init]; });
              return instance;
          }

          - (instancetype)init {
              if (self = [super init]) {
                  _workerQueue = dispatch_queue_create("com.autoplay.blockblast.worker", DISPATCH_QUEUE_SERIAL);
                  _runState.store(BBAuto::EngineRunState::STOPPED);
                  _loopActive.store(false);
              }
              return self;
          }

          - (UIWindow *)findActiveGameWindow {
              __block UIWindow* foundWindow = nil;
              auto finder = ^{
                  NSMutableArray<UIWindow*>* allWindows = [NSMutableArray array];
                  if (@available(iOS 13.0, *)) {
                      for (UIScene* scene in [UIApplication sharedApplication].connectedScenes)
                          if ([scene isKindOfClass:[UIWindowScene class]])
                              [allWindows addObjectsFromArray:((UIWindowScene*)scene).windows];
                  }
                  if (allWindows.count == 0) [allWindows addObjectsFromArray:[[UIApplication sharedApplication] windows]];
                  for (UIWindow* win in allWindows) {
                      if (win == self->_overlayWindow) continue;
                      if (!win.hidden && win.alpha > 0.01 && CGRectGetWidth(win.bounds) > 200) { foundWindow = win; break; }
                  }
              };
              if ([NSThread isMainThread]) finder();
              else dispatch_sync(dispatch_get_main_queue(), finder);
              return foundWindow;
          }

          - (void)attachToApplicationWindow {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow* gameWin = [self findActiveGameWindow];
                  if (!gameWin) return;
                  BOOL isNew = NO;
                  if (!self->_overlayWindow) {
                      self->_overlayWindow = [[BBAutoOverlayWindow alloc] initWithFrame:gameWin.bounds];
                      self->_overlayWindow.controlDelegate = self;
                      isNew = YES;
                  }
                  if (@available(iOS 13.0, *)) {
                      if (gameWin.windowScene && self->_overlayWindow.windowScene != gameWin.windowScene)
                          self->_overlayWindow.windowScene = gameWin.windowScene;
                  }
                  self->_overlayWindow.hidden = NO;
                  if (isNew) [self refreshUI];
              });
          }

          - (void)refreshUI {
              if (_overlayWindow) [_overlayWindow updateTelemetry:_telemetry runState:_runState.load() calibration:_calibration];
          }

          - (void)onOverlayAutoPlayClicked {
              _lockedGuidePlan.feasible = false;
              _runState.store(BBAuto::EngineRunState::AUTO_PLAYING);
              _telemetry.statusMessage = "AUTO: Keo 1.65 & tim duong 3s...";
              [self refreshUI];
              if (!_loopActive.exchange(true)) [self scheduleNextCycleWithDelay:0.12];
          }

          - (void)onOverlayGuideModeClicked {
              _lockedGuidePlan.feasible = false;
              _lockedGuideStepIdx = 0; _placementConfirmCounter = 0;
              _runState.store(BBAuto::EngineRunState::GUIDE_PLAYING);
              _telemetry.statusMessage = "HDAN CHOI: Mo phong chinh xac...";
              [self refreshUI];
              if (!_loopActive.exchange(true)) [self scheduleNextCycleWithDelay:0.10];
          }

          - (void)onOverlayStopClicked {
              _runState.store(BBAuto::EngineRunState::STOPPED);
              _loopActive.store(false);
              _lockedGuidePlan.feasible = false;
              _telemetry.hasActiveGuideMove = false;
              _telemetry.isSteeringHold = false;
              _telemetry.statusMessage = "Da dung";
              [self refreshUI];
          }

          - (void)onOverlayStrategyChanged:(BBAuto::PlayStrategy)newStrategy { _telemetry.requestedStrategy = newStrategy; _lockedGuidePlan.feasible = false; [self refreshUI]; }
          - (void)onOverlayGainChanged:(float)newGain { _calibration.dragGainX = newGain; _calibration.dragGainY = newGain; _calibration.learnedBiasRow = 0; _calibration.learnedBiasCol = 0; }
          - (void)onOverlayLiftYChanged:(float)newLiftY { _calibration.dragLiftOffsetY = newLiftY; _calibration.learnedBiasRow = 0; }
          - (void)onOverlayBoardYChanged:(float)newBoardY { _calibration.boardY = newBoardY; [self triggerLiveDetection]; }
          - (void)onOverlayBoardWChanged:(float)newBoardW { _calibration.boardW = newBoardW; _calibration.boardX = (1.0f - newBoardW) * 0.5f; [self triggerLiveDetection]; }
          - (void)onOverlayDockYChanged:(float)newDockY { _calibration.dockY = newDockY; [self triggerLiveDetection]; }
          - (void)onOverlayToggleCalibrationFrame:(BOOL)visible { _calibration.showCalibrationOverlay = visible; [self triggerLiveDetection]; }

          - (void)triggerLiveDetection {
              dispatch_async(_workerQueue, ^{
                  UIWindow* gameWin = [self findActiveGameWindow];
                  if (gameWin) {
                      BBAuto::VisionSnapshotResult snap = self->_vision.analyzeCurrentScreen(gameWin, self->_overlayWindow, self->_calibration);
                      if (snap.success) {
                          self->_telemetry.lastDetectedBoard = snap.boardBits;
                          for (int i = 0; i < 3 && i < (int)snap.dockPieces.size(); ++i) self->_telemetry.lastDetectedDock[i] = snap.dockPieces[i];
                      }
                  }
                  [self refreshUI];
              });
          }

          - (BBAuto::VisionSnapshotResult)captureVerifiedSnapshot:(UIWindow *)gameWindow outRawPixels:(std::vector<BBAuto::VisionAnalyzer::RGBAPixel> &)outPixels outW:(int &)outW outH:(int &)outH {
              outW = 360; outH = 0;
              BBAuto::VisionSnapshotResult snap1, snap2;
              if (!BBAuto::VisionAnalyzer::captureWindowPixels(gameWindow, _overlayWindow, outW, outH, outPixels)) return snap1;
              snap1 = _vision.analyzePixels(outPixels, outW, outH, _calibration);

              if (snap1.boardConfidence < 0.45f || BBAuto::popcount64(snap1.boardBits) >= 54 || !_solver.hasAnySingleValidMove(snap1.boardBits, snap1.dockPieces)) {
                  [NSThread sleepForTimeInterval:0.12];
                  std::vector<BBAuto::VisionAnalyzer::RGBAPixel> pixels2;
                  int h2 = 0;
                  if (BBAuto::VisionAnalyzer::captureWindowPixels(gameWindow, _overlayWindow, outW, h2, pixels2)) {
                      snap2 = _vision.analyzePixels(pixels2, outW, h2, _calibration);
                      if (snap2.success) {
                          snap1.boardBits &= snap2.boardBits;
                          outPixels = std::move(pixels2);
                          outH = h2;
                      }
                  }
              }
              return snap1;
          }

          // KEO LEN VOI BIEN KEO 1.65 -> GIU 3 GIAY TIM DUONG DUA KHOI XEP CHO VAO DUNG HINH MO PHONG -> THA RA
          - (bool)executeDragAndSteer3Seconds:(UIWindow *)gameWindow
                                         move:(const BBAuto::PlacementMove &)move
                                 preBoardBits:(uint64_t)preBoardBits
                                preDragPixels:(const std::vector<BBAuto::VisionAnalyzer::RGBAPixel> &)preDragPixels
                                         bufW:(int)bufW
                                         bufH:(int)bufH {
              CGSize winSize = gameWindow.bounds.size;
              CGPoint startPt = CGPointMake(move.piece.centerNormX * winSize.width, move.piece.centerNormY * winSize.height);
              float corrRow = 0.0f, corrCol = 0.0f;
              CGPoint holdPt = _touch.computeFingerHoldPoint(gameWindow, move, _calibration, corrRow, corrCol);

              _telemetry.isSteeringHold = true;
              _telemetry.liveHeldRow = -1;
              _telemetry.liveHeldCol = -1;
              _telemetry.statusMessage = "Keo len (1.65) -> Tim duong 3s...";
              [self refreshUI];

              // 1. Keo khoi tu khay len ban co voi Bien keo = 1.65 va giu tay
              _touch.beginAndDragToHoldPoint(gameWindow, startPt, holdPt, _calibration.dragSpeedMultiplier);

              int matchedCounter = 0;

              // 2. Vong lap 3 GIAY (12 nhip x ~0.25s = 3.0s) de tim duong dua khoi xep cho vao khop hinh mo phong
              for (int step = 0; step < 12; ++step) {
                  if (_runState.load() != BBAuto::EngineRunState::AUTO_PLAYING) {
                      _touch.commitDropAtPoint(gameWindow, startPt);
                      _telemetry.isSteeringHold = false;
                      return false;
                  }

                  _touch.sendHoldHeartbeat(gameWindow, holdPt);
                  [NSThread sleepForTimeInterval:0.12];
                  _touch.sendHoldHeartbeat(gameWindow, holdPt);
                  [NSThread sleepForTimeInterval:0.10];

                  std::vector<BBAuto::VisionAnalyzer::RGBAPixel> liveHoldPixels;
                  int liveH = 0;
                  if (BBAuto::VisionAnalyzer::captureWindowPixels(gameWindow, _overlayWindow, bufW, liveH, liveHoldPixels) && liveH == bufH) {
                      int detRow = -1, detCol = -1;
                      bool found = _vision.detectHeldPieceOnBoard(preDragPixels, liveHoldPixels, bufW, bufH, preBoardBits, _calibration, move, detRow, detCol);

                      if (found) {
                          _telemetry.liveHeldRow = detRow;
                          _telemetry.liveHeldCol = detCol;
                          int errRow = detRow - move.targetRow;
                          int errCol = detCol - move.targetCol;

                          if (errRow == 0 && errCol == 0) {
                              matchedCounter++;
                              _telemetry.statusMessage = "Khop mo phong (" + std::to_string(detRow + 1) + "," + std::to_string(detCol + 1) + ") [" + std::to_string(step + 1) + "/12]";
                              [self refreshUI];
                              // Khi da nam gon trong hinh mo phong on dinh 3 nhip va qua it nhat ~1.5s thi co the tha hoac giu du
                              if (matchedCounter >= 3 && step >= 6) break;
                          } else {
                              matchedCounter = 0;
                              float stepR = std::clamp<float>(-errRow * 0.65f, -1.6f, 1.6f);
                              float stepC = std::clamp<float>(-errCol * 0.65f, -1.6f, 1.6f);
                              corrRow = std::clamp<float>(corrRow + stepR, -4.5f, 4.5f);
                              corrCol = std::clamp<float>(corrCol + stepC, -4.5f, 4.5f);

                              CGPoint newHoldPt = _touch.computeFingerHoldPoint(gameWindow, move, _calibration, corrRow, corrCol);
                              _telemetry.statusMessage = "Tim duong (" + std::to_string(detRow + 1) + "," + std::to_string(detCol + 1) + ") -> (" + std::to_string(move.targetRow + 1) + "," + std::to_string(move.targetCol + 1) + ")";
                              [self refreshUI];
                              _touch.mov

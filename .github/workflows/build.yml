          - (void)updateTelemetry:(const BBAuto::RuntimeTelemetry&)telemetry runState:(BBAuto::EngineRunState)runState calibration:(const BBAuto::CalibrationConfig&)config {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self->_guideView.currentConfig = config;
                  self->_guideView.currentTelemetry = telemetry;
                  self->_guideView.currentRunState = runState;
                  [self->_guideView setNeedsDisplay];
                  NSString* stratStr = (telemetry.effectiveStrategy == BBAuto::PlayStrategy::MAX_SURVIVAL) ? @"MAX_SURVIVAL" : @"AUTO_COMBO";
                  self->_statsLabel.text = [NSString stringWithFormat:@"Luot: %d | Hang xoa: %d | Combo: %d\nPhuong an: %d | Chien thuat: %@",
                      telemetry.turnsExecuted, telemetry.totalLinesCleared, telemetry.currentCombo, telemetry.lastValidSequences, stratStr];
                  self->_statusLabel.text = [NSString stringWithFormat:@"Trang thai: %s", telemetry.statusMessage.c_str()];
              });
          }
          @end

          @interface BBAutoPlayController : NSObject <BBAutoOverlayDelegate>
          + (instancetype)sharedInstance;
          - (void)attachToApplicationWindow;
          @end

          @implementation BBAutoPlayController {
              BBAutoOverlayWindow* _overlayWindow;
              dispatch_queue_t _workerQueue;
              BBAuto::BlockSolver _solver;
              BBAuto::VisionAnalyzer _vision;
              BBAuto::TouchSynthesizer _touch;
              BBAuto::CalibrationConfig _calibration;
              BBAuto::RuntimeTelemetry _telemetry;
              std::atomic<BBAuto::EngineRunState> _runState;
              std::atomic<bool> _loopActive;
              BBAuto::TurnPlan _lockedGuidePlan;
              int _lockedGuideStepIdx, _placementConfirmCounter;
              uint64_t _boardBeforeGuideStep;
          }

          + (instancetype)sharedInstance {
              static BBAutoPlayController* instance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ instance = [[BBAutoPlayController alloc] init]; });
              return instance;
          }

          - (instancetype)init {
              if (self = [super init]) {
                  _workerQueue = dispatch_queue_create("com.autoplay.blockblast.worker", DISPATCH_QUEUE_SERIAL);
                  _runState.store(BBAuto::EngineRunState::STOPPED);
                  _loopActive.store(false);
              }
              return self;
          }

          - (UIWindow *)findActiveGameWindow {
              __block UIWindow* foundWindow = nil;
              auto finder = ^{
                  NSMutableArray<UIWindow*>* allWindows = [NSMutableArray array];
                  if (@available(iOS 13.0, *)) {
                      for (UIScene* scene in [UIApplication sharedApplication].connectedScenes)
                          if ([scene isKindOfClass:[UIWindowScene class]])
                              [allWindows addObjectsFromArray:((UIWindowScene*)scene).windows];
                  }
                  if (allWindows.count == 0) [allWindows addObjectsFromArray:[[UIApplication sharedApplication] windows]];
                  for (UIWindow* win in allWindows) {
                      if (win == self->_overlayWindow) continue;
                      if (!win.hidden && win.alpha > 0.01 && CGRectGetWidth(win.bounds) > 200) { foundWindow = win; break; }
                  }
              };
              if ([NSThread isMainThread]) finder();
              else dispatch_sync(dispatch_get_main_queue(), finder);
              return foundWindow;
          }

          - (void)attachToApplicationWindow {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow* gameWin = [self findActiveGameWindow];
                  if (!gameWin) return;
                  BOOL isNew = NO;
                  if (!self->_overlayWindow) {
                      self->_overlayWindow = [[BBAutoOverlayWindow alloc] initWithFrame:gameWin.bounds];
                      self->_overlayWindow.controlDelegate = self;
                      isNew = YES;
                  }
                  if (@available(iOS 13.0, *)) {
                      if (gameWin.windowScene && self->_overlayWindow.windowScene != gameWin.windowScene)
                          self->_overlayWindow.windowScene = gameWin.windowScene;
                  }
                  self->_overlayWindow.hidden = NO;
                  if (isNew) [self refreshUI];
              });
          }

          - (void)refreshUI {
              if (_overlayWindow) [_overlayWindow updateTelemetry:_telemetry runState:_runState.load() calibration:_calibration];
          }

          - (void)onOverlayAutoPlayClicked {
              _lockedGuidePlan.feasible = false;
              _runState.store(BBAuto::EngineRunState::AUTO_PLAYING);
              _telemetry.statusMessage = "AUTO CHOI: Dang chay...";
              [self refreshUI];
              if (!_loopActive.exchange(true)) [self scheduleNextCycleWithDelay:0.12];
          }

          - (void)onOverlayGuideModeClicked {
              _lockedGuidePlan.feasible = false;
              _lockedGuideStepIdx = 0; _placementConfirmCounter = 0;
              _runState.store(BBAuto::EngineRunState::GUIDE_PLAYING);
              _telemetry.statusMessage = "HDAN CHOI: Mo phong khoi...";
              [self refreshUI];
              if (!_loopActive.exchange(true)) [self scheduleNextCycleWithDelay:0.10];
          }

          - (void)onOverlayStopClicked {
              _runState.store(BBAuto::EngineRunState::STOPPED);
              _loopActive.store(false);
              _lockedGuidePlan.feasible = false;
              _telemetry.hasActiveGuideMove = false;
              _telemetry.statusMessage = "Da dung";
              [self refreshUI];
          }

          - (void)onOverlayStrategyChanged:(BBAuto::PlayStrategy)newStrategy { _telemetry.requestedStrategy = newStrategy; _lockedGuidePlan.feasible = false; [self refreshUI]; }
          - (void)onOverlayGainChanged:(float)newGain { _calibration.dragGainX = newGain; _calibration.dragGainY = newGain; }
          - (void)onOverlaySpeedChanged:(float)newSpeed { _calibration.dragSpeedMultiplier = newSpeed; }
          - (void)onOverlayBoardYChanged:(float)newBoardY { _calibration.boardY = newBoardY; [self triggerLiveDetection]; }
          - (void)onOverlayBoardWChanged:(float)newBoardW { _calibration.boardW = newBoardW; _calibration.boardX = (1.0f - newBoardW) * 0.5f; [self triggerLiveDetection]; }
          - (void)onOverlayDockYChanged:(float)newDockY { _calibration.dockY = newDockY; [self triggerLiveDetection]; }
          - (void)onOverlayToggleCalibrationFrame:(BOOL)visible { _calibration.showCalibrationOverlay = visible; [self triggerLiveDetection]; }

          - (void)triggerLiveDetection {
              dispatch_async(_workerQueue, ^{
                  UIWindow* gameWin = [self findActiveGameWindow];
                  if (gameWin) {
                      BBAuto::VisionSnapshotResult snap = self->_vision.analyzeCurrentScreen(gameWin, self->_overlayWindow, self->_calibration);
                      if (snap.success) {
                          self->_telemetry.lastDetectedBoard = snap.boardBits;
                          for (int i = 0; i < 3 && i < (int)snap.dockPieces.size(); ++i) self->_telemetry.lastDetectedDock[i] = snap.dockPieces[i];
                      }
                  }
                  [self refreshUI];
              });
          }

          - (void)scheduleNextCycleWithDelay:(double)delaySeconds {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, static_cast<int64_t>(delaySeconds * NSEC_PER_SEC)), _workerQueue, ^{ [self executeSolverCycle]; });
          }

          - (void)executeSolverCycle {
              BBAuto::EngineRunState mode = _runState.load();
              if (mode == BBAuto::EngineRunState::STOPPED) { _loopActive.store(false); return; }
              UIWindow* gameWindow = [self findActiveGameWindow];
              if (!gameWindow) { _telemetry.statusMessage = "Dang cho cua so game..."; [self refreshUI]; [self scheduleNextCycleWithDelay:0.5]; return; }

              BBAuto::VisionSnapshotResult snap = _vision.analyzeCurrentScreen(gameWindow, _overlayWindow, _calibration);
              if (!snap.success) { _telemetry.statusMessage = "Loi chup man hinh"; [self refreshUI]; [self scheduleNextCycleWithDelay:0.4]; return; }

              _telemetry.lastDetectedBoard = snap.boardBits;
              int validPiecesCount = 0;
              for (int i = 0; i < 3 && i < (int)snap.dockPieces.size(); ++i) {
                  _telemetry.lastDetectedDock[i] = snap.dockPieces[i];
                  if (snap.dockPieces[i].valid) validPiecesCount++;
              }

              if (mode == BBAuto::EngineRunState::GUIDE_PLAYING) {
                  if (_lockedGuidePlan.feasible && _lockedGuideStepIdx < (int)_lockedGuidePlan.moves.size()) {
                      const BBAuto::PlacementMove& activeMv = _lockedGuidePlan.moves[_lockedGuideStepIdx];
                      int slot = activeMv.slotIndex;
                      bool slotEmptyNow = (slot >= 0 && slot < 3 && !snap.dockPieces[slot].valid);
                      bool targetCellsFilled = ((snap.boardBits & activeMv.rawMaskOnBoard) == activeMv.rawMaskOnBoard);
                      bool lineClearedMatch = (activeMv.linesCleared > 0 && snap.boardBits == activeMv.expectedBoardAfter);
                      if (slotEmptyNow && (targetCellsFilled || lineClearedMatch)) {
                          if (++_placementConfirmCounter >= 2) {
                              _placementConfirmCounter = 0; _telemetry.movesExecuted++;
                              if (activeMv.linesCleared > 0) { _telemetry.totalLinesCleared += activeMv.linesCleared; _telemetry.currentCombo++; _telemetry.movesSinceLastClear = 0; }
                              else if (++_telemetry.movesSinceLastClear >= 3) _telemetry.currentCombo = 0;
                              _lockedGuideStepIdx++; _boardBeforeGuideStep = snap.boardBits;
                              if (_lockedGuideStepIdx < (int)_lockedGuidePlan.moves.size()) {
                                  const auto& nextMv = _lockedGuidePlan.moves[_lockedGuideStepIdx];
                                  _telemetry.hasActiveGuideMove = true; _telemetry.currentGuideMove = nextMv;
                                  _telemetry.guideStepIndex = _lockedGuideStepIdx; _telemetry.guideTotalSteps = (int)_lockedGuidePlan.moves.size();
                                  _telemetry.statusMessage = "Buoc " + std::to_string(_lockedGuideStepIdx + 1) + "/" + std::to_string(_telemetry.guideTotalSteps) + ": Keo khay " + std::to_string(nextMv.slotIndex + 1);
                                  [self refreshUI]; [self scheduleNextCycleWithDelay:0.15]; return;
                              } else {
                                  _telemetry.turnsExecuted++; _lockedGuidePlan.feasible = false; _telemetry.hasActiveGuideMove = false;
                                  _telemetry.statusMessage = "Xong luot! Cho 3 khoi moi...";
                                  [self refreshUI]; [self scheduleNextCycleWithDelay:0.25]; return;
                              }
                          }
                      } else if (slotEmptyNow && snap.boardBits != _boardBeforeGuideStep) {
                          if (++_placementConfirmCounter >= 5 && validPiecesCount > 0) { _lockedGuidePlan.feasible = false; _placementConfirmCounter = 0; }
                      } else _placementConfirmCounter = 0;
                      if (_lockedGuidePlan.feasible) { [self refreshUI]; [self scheduleNextCycleWithDelay:0.15]; return; }
                  }
                  if (validPiecesCount == 0) { _telemetry.hasActiveGuideMove = false; _telemetry.statusMessage = "Cho 3 khoi moi..."; [self refreshUI]; [self scheduleNextCycleWithDelay:0.25]; return; }
                  BBAuto::TurnPlan plan = _solver.solveTurn(snap.boardBits, snap.dockPieces, _telemetry.currentCombo, _telemetry.movesSinceLastClear, _telemetry.requestedStrategy);
                  _telemetry.effectiveStrategy = plan.activeStrategy; _telemetry.lastValidSequences = plan.validSequencesFound;
                  if (!plan.feasible || plan.moves.empty()) { _telemetry.hasActiveGuideMove = false; _telemetry.statusMessage = "Het nuoc di!"; [self refreshUI]; [self scheduleNextCycleWithDelay:0.5]; return; }
                  _lockedGuidePlan = plan; _lockedGuideStepIdx = 0; _boardBeforeGuideStep = snap.boardBits; _placementConfirmCounter = 0;
                  const auto& mv0 = _lockedGuidePlan.moves[0];
                  _telemetry.hasActiveGuideMove = true; _telemetry.currentGuideMove = mv0; _telemetry.guideStepIndex = 0; _telemetry.guideTotalSteps = (int)_lockedGuidePlan.moves.size();
                  _telemetry.statusMessage = "Buoc 1/" + std::to_string(_telemetry.guideTotalSteps) + ": Keo khay " + std::to_string(mv0.slotIndex + 1);
                  [self refreshUI]; [self scheduleNextCycleWithDelay:0.15]; return;
              }

              if (validPiecesCount == 0) { _telemetry.hasActiveGuideMove = false; _telemetry.statusMessage = "Cho 3 khoi moi..."; [self refreshUI]; [self scheduleNextCycleWithDelay:0.25]; return; }
              BBAuto::TurnPlan plan = _solver.solveTurn(snap.boardBits, snap.dockPieces, _telemetry.currentCombo, _telemetry.movesSinceLastClear, _telemetry.requestedStrategy);
              _telemetry.effectiveStrategy = plan.activeStrategy; _telemetry.lastValidSequences = plan.validSequencesFound;
              if (!plan.feasible || plan.moves.empty()) { _telemetry.hasActiveGuideMove = false; _telemetry.statusMessage = "Het nuoc di!"; [self refreshUI]; [self scheduleNextCycleWithDelay:0.6]; return; }

              const BBAuto::PlacementMove firstMove = plan.moves.front();
              int prevSlot = firstMove.slotIndex;
              _telemetry.hasActiveGuideMove = true; _telemetry.currentGuideMove = firstMove; _telemetry.guideStepIndex = 0; _telemetry.guideTotalSteps = (int)plan.moves.size();
              _telemetry.statusMessage = "Auto keo khay " + std::to_string(prevSlot + 1);
              [self refreshUI];

              dispatch_semaphore_t dragDoneSem = dispatch_semaphore_create(0);
              _touch.executeDragMove(gameWindow, firstMove, _calibration, ^{ dispatch_semaphore_signal(dragDoneSem); });
              dispatch_semaphore_wait(dragDoneSem, dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));
              [NSThread sleepForTimeInterval:(firstMove.linesCleared > 0) ? 0.38 : 0.24];

              if (_runState.load() != BBAuto::EngineRunState::AUTO_PLAYING) { _loopActive.store(false); return; }
              BBAuto::VisionSnapshotResult postSnap = _vision.analyzeCurrentScreen(gameWindow, _overlayWindow, _calibration);
              if ((prevSlot >= 0 && prevSlot < 3 && !postSnap.dockPieces[prevSlot].valid) || (postSnap.boardBits != snap.boardBits)) {
                  _telemetry.movesExecuted++;
                  if (_telemetry.movesExecuted % 3 == 0) _telemetry.turnsExecuted++;
                  if (firstMove.linesCleared > 0) { _telemetry.totalLinesCleared += firstMove.linesCleared; _telemetry.currentCombo++; _telemetry.movesSinceLastClear = 0; }
                  else if (++_telemetry.movesSinceLastClear >= 3) _telemetry.currentCombo = 0;
                  _telemetry.statusMessage = "Dat thanh cong!";
                  [self refreshUI]; [self scheduleNextCycleWithDelay:0.10];
              } else {
                  _telemetry.statusMessage = "Chua khop, chinh Bien keo";
                  [self refreshUI]; [self scheduleNextCycleWithDelay:0.25];
              }
          }
          @end

          __attribute__((constructor))
          static void initializeBlockBlastAutoDylib() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [NSTimer scheduledTimerWithTimeInterval:1.5 repeats:YES block:^(NSTimer * _Nonnull timer) {
                      [[BBAutoPlayController sharedInstance] attachToApplicationWindow];
                  }];
              });
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -dynamiclib \
            -std=c++17 \
            -fobjc-arc \
            -O3 \
            -mios-version-min=14.0 \
            -isysroot "$SDK_PATH" \
            -Wl,-install_name,@rpath/BlockBlastAuto.dylib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            BlockBlastAuto.mm \
            -o BlockBlastAuto.dylib

          ldid -S BlockBlastAuto.dylib
          rm -f BlockBlastAuto.mm

      - name: Commit BlockBlastAuto.dylib directly to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f BlockBlastAuto.dylib
          git diff --staged --quiet || (git commit -m "Build BlockBlastAuto.dylib [skip ci]" && git push)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAuto-dylib
          path: BlockBlastAuto.dylib